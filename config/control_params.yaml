# =============================================================================
#  控制器调参 —— ads_control 专用（P2-S4）
#
#  ⚠️ **这里只放"我们想怎么开"，不放"车能做什么"。**
#
#     车辆能力（轴距、最大转角、转向速率、巡航速度、加减速限值）**全部**在
#     config/vehicle_params.yaml，由 launch 搬运给 control_node。
#     在这里再写一份的话，换一辆车要去两个文件里翻，漏改一处的症状是
#     「本地调好的参数一上 CARLA 就震荡」—— 而那是 SPEC §4.1 的头号风险。
#
#     判断某个数该放哪：**换一辆车它会不会变？** 会 → vehicle_params.yaml。
#
#  每个参数的物理含义与调大/调小的后果见 docs/modules/control.md §6.2。
#  这里只写结论，推导在那边。
# =============================================================================

lateral:
  # Stanley 的横向误差增益 k_e，量纲 **1/s**（不是无量纲）。
  # 直线上闭环退化成 ė ≈ −k_e·e，时间常数 1/k_e。
  # **收敛速度与车速无关**（前提 k_soft ≪ v），这是 Stanley 相对纯追踪最大的优点。
  #
  # 1.0 → 时间常数 1 s，从 1.0 m 收到 0.05 m 理论 3.00 s，L1 实测 3.36 s。
  # 调大（→3.0）收敛快但与 0.5 rad/s 的转向速率限幅耦合后易震荡；
  # 调小（→0.5）收敛慢，入弯暂态偏差变大。经验范围 0.5–3.0。
  gain: 1.0

  # 低速软化项 k_soft，单位 m/s。存在的唯一理由：v→0 时 k_e·e/v → ∞，
  # arctan 饱和到 ±π/2，**停车时方向盘打死**，而低速正是每次运行必经的工况。
  #
  # 0.5 → 巡航 5.556 下打折 8.3%（几乎无感），0.5 m/s 爬行时打折 50%（保守，正确）。
  # 调大（→2.0）低速平稳但高速收敛也慢 26%；调小（→0）接近停车时转角抖动，
  # 等于 0 时打死。
  soft_speed_mps: 0.5

  # 最近点局部搜索的半窗口，单位**点数**。
  #
  # ⚠️ 它**不是性能优化，是正确性要求**：环线上自车前后必然存在几何距离
  #    相近的两段路径（刚驶出路口时尤其明显），全局最近点会在两者之间跳，
  #    症状是**转角瞬间打死**。
  #
  # 0.5729 m/点 × 30 ≈ 17 m。一拍（20 ms）最多走 0.17 m ≈ 0.3 个点，
  # 留了两个数量级余量，足够吸收调度抖动和短暂的 TF 延迟。
  # 调小 → 车速高或某拍卡顿时可能"追不上"路径；调大 → 退化成全局搜索。
  search_window: 30

longitudinal:
  # 速度环比例增益 K_p，量纲 1/s。闭环时间常数就是 1/K_p。
  # 1.0 → 63% 收敛用 1 s，95% 用 3 s。
  # 调大（→2.0）跟得紧，但更容易顶到加速度限幅和 bridge 的抗饱和；
  # 调小（→0.5）起步和终点减速拖沓。范围 0.5–2.0。
  kp: 1.0

  # 积分增益 K_i，量纲 1/s²。
  #
  # ⚠️ **0.0 是推荐初值，而且它是对的，不是"还没调"。**
  #    被控对象自带一个积分（控制器输出加速度，而 a = v̇），
  #    所以**纯 P 对常值目标速度就没有稳态误差** —— L1 实测残差 3.9e-5 mm/s。
  #    积分项补偿的是**持续扰动**（长坡、恒定阻力），本项目地图是平的。
  #
  #    **只有实测出稳态误差、且说得出那个误差来自哪个物理量时才往上加。**
  #    「加点积分试试」是本领域最常见的一种无依据调参，后果是超调加震荡，
  #    而且是那种"看起来还需要更多调参"的震荡。
  ki: 0.0

  # 没有 kd，而且是**有意不提供**这个参数。
  # 被控对象已经是一阶，微分项唯一的作用是放大 /odom 的速度噪声。
  # 提供一个"建议填 0"的参数，迟早有人去调它。

profile:
  # 过弯的横向加速度上限 a_lat_max，单位 m/s²。速度剖面按
  # v = min(v_cruise, √(a_lat_max/|κ|)) 逐点限速。
  #
  # 1.5 → R=8 的路口转弯车道限速 3.464 m/s（12.5 km/h）。
  # 对照：定速 20 km/h 过那个弯，横向加速度是 **3.86 m/s²**，紧急变道的量级 ——
  # 园区接驳车上站着的人会扶不住。舒适区 1.5–2.0。
  #
  # ⚠️ **它与转向速率限幅耦合，调大不只是"过弯快一点"。**
  #    入弯所需的转向速率就是 v/R，所以限幅起作用的临界车速是
  #    v* = R · max_steer_rate_rad_s = 8 × 0.5 = **4.0 m/s**。
  #    而 a_lat_max = 2.0 给出的限速 √(2.0×8) **恰好就是 4.0** —— 正好顶在临界值上。
  #    见 docs/modules/control.md §3.7。
  #
  # ⚠️ 运动学模型**不体现轮胎打滑**：调到 5 以上仿真里"能过"而真车会失控。
  max_lateral_accel_mps2: 1.5

goal:
  # 距路径终点多近算"到了"，之后目标速度强制归零，单位 m。
  #
  # 调大 → 提前停，终点位置误差变大；
  # 调小 → 剖面末端速度极低时速度环反复微调，车"蹭"到终点。
  stop_distance_m: 0.5

safety:
  # 横向误差超过它就判定"偏离路径"并减速停车，单位 m。
  #
  # 这是**兜底**，不是精度考核。依据：车道半宽 1.750 − 半车宽 0.900 = 越界线 0.850 m；
  # 取 1.5 m 是"已经压到相邻车道或绿化带"的量级。
  # 比 CP-P2-B 的 0.30 m 判据宽 5 倍是有意的 —— 调到判据附近会在正常暂态里误触发，
  # 而一个动不动就刹停的兜底会被人关掉，那还不如没有。
  max_lateral_error_m: 1.5

  # /odom 停多久算断了，单位 s（**仿真时间**）。
  #
  # 取 0.5 与 gazebo_bridge 看门狗的 cmd_timeout_s 相同，这是有意的：
  # 两层同时判定失联，日志能互相印证，而不是一层说断了另一层说没断。
  odom_timeout_s: 0.5

# 控制周期，Hz。
#
# 下限由 bridge 看门狗 0.5 s 定（≥2 Hz 即可，取 50 是 25 倍余量）；
# 上限由单拍耗时定（必须 < 10 ms，SPEC §7）。
#
# 它还直接决定一个量：Stanley 在定曲率路径上的**离散化残差** e_ss ≈ 0.81·dt，
# 50 Hz 下是 1.6 cm。想把它压小要**提高控制频率**，调增益动不了它 ——
# 它根本不是增益造成的（docs/modules/control.md §3.4）。
control_rate_hz: 50.0
