# =============================================================================
#  P5 验收场景里的**动态**目标 —— 唯一手写的源头（P5-S1）
#
#  ⚠️ Gazebo 里的模型（models/campus_dynamic_<场景>/model.sdf）由
#     scripts/gen_dynamic_actors.py 从本文件生成，**不要手改生成物**。
#
#  与 config/obstacles.yaml 完全同构，只是那份管静止的、这份管会动的。
#  两份分开而不是合并，理由是它们的**注入时机与消费者都不同**：
#  静态障碍物 P3 就在用（规划的碰撞检查），动态目标是 P5 感知才需要的。
#
#  ⚠️ **动态目标不进 worlds/campus_loop.sdf**，与静态障碍物同一条规矩：
#     那个世界是 CP-P2-B / CP-P3-B / CP-P4-B **三个**检查点的回归基线。
#     往里加一辆会动的车，点云、NDT 的 inlier、规划的碰撞检查全都会变，
#     三组实测数字一次作废。所以按场景在**运行时**注入（ros_gz_sim create），
#     见 gazebo_sim.launch.py 的 dynamic 参数，默认 none。
# =============================================================================

# -----------------------------------------------------------------------------
#  为什么行人是个「盒子」而不是 Gazebo 的 <actor>
# -----------------------------------------------------------------------------
#  用户拍板的是「一车一人」这个**范围**，而 <actor> 是实现方式。
#  P5-S1 实测（2026-08-11）把那条路否掉了，三条理由：
#
#  ① **不带 skin 的 <actor> 会让 Gazebo 直接崩。** 对照实验：同一个世界，
#     有 actor 时一旦有人订阅 /world/<name>/dynamic_pose/info 就 segfault，
#     崩在 SceneBroadcaster::PoseUpdate（空指针）；去掉 actor 则一切正常。
#     而 ros_gz_bridge / RViz 必然会订阅位姿话题。
#  ② **带 skin 的 <actor> 要从 Fuel 下载 walk.dae**（实测可达，HTTP 200/5.9 s），
#     那是一个**外部网络依赖**。CI、离线、云端实例上任何一次拿不到，
#     症状都是「仿真起来了但人不见了」，而没有任何一层会报错。
#  ③ actor 的真值只能走 dynamic_pose/info，与 model 的 OdometryPublisher
#     是**两条路径**。plan.md 的 P5-6 风险表把「两条真值路径漂移」列为
#     本切片的风险之一 —— 用 model 的话这个风险直接消失，
#     一套驱动（cmd_vel）、一套真值（OdometryPublisher）、一个控制器节点。
#
#  ⚠️ **代价要知道，它不只是观感**：真人形的点云比盒子**更稀疏、更不规则**
#     （四肢分开、中间有空隙），欧式聚类有可能把一个人分成两簇。
#     盒子行人**不会**出现这个失效模式，所以本阶段的检测率判据是**偏乐观的**。
#     那一条要等 P8 的 CARLA 验收（那里有真实行人模型）—— 与 P5-1 决策五
#     「P5 只做 Gazebo 那一半」是同一件事的两面。

# -----------------------------------------------------------------------------
#  车道几何。与 config/obstacles.yaml 的 lane 段是**同一条**南侧直道
# -----------------------------------------------------------------------------
#  ⚠️ 这些数字来自 config/campus_map.yaml 的推导结果，生成器**不会**替你重算
#     （它不解析地图几何，那是 ads_map 的事）。改了 campus_map.yaml 的
#     loop.width_m 或 lanes.width_m，这里和 obstacles.yaml 都要跟着改。
lane:
  # 自车所在车道的中心线 y（行驶方向 +x）。
  ego_center_y_m: -51.75
  # 对向车道的中心线 y。道路参考线 y = −50，向北偏半个车道宽 1.75。
  # NPC 车走这条 —— **对向行驶是有意的**：这样真值速度的 x 分量是负的，
  # 而自车是正的，「速度估计符号错了」这种错误才暴露得出来。
  # 同向行驶的话相对速度接近零，符号错了也看不出来。
  oncoming_center_y_m: -48.25
  heading_rad: 0.0

  # 这条直道在世界坐标里的有效 x 区间。所有航点必须落在里面，
  # 否则生成器报错 —— 跑到路面外面的目标在 RViz 里看着正常，
  # 只是自车永远遇不到它，于是"感知测试通过"变成一句空话。
  #
  # ⚠️ **110 覆盖到了直道端点（x=78，SE 弯起点）之外**（P6-S1 对账发现，
  #    obstacles.yaml 的同名字段是 78.0）：npc_car 航点 x=105、行人 x=95
  #    都在弯角以外的草地上空掉头（道具无碰撞无重力，物理上没事）。
  #    对 P5 打分无影响（真值走 pose_gt），但**数值不能收** —— 收到 78 会
  #    拒绝现有航点，而它们是 CP-P5-B 基线的一部分。曾经的教训照例写明：
  #    这条校验守的其实是「自车遇得到」，不是「在铺装路面上」。
  valid_from_x_m: 11.0
  valid_to_x_m: 110.0

  # 自车车道的半宽。**机械校验用**：动态目标的航点不许侵入这个范围，
  # 理由见下面 pedestrian 的说明。
  ego_lane_half_width_m: 1.75

# -----------------------------------------------------------------------------
#  环线内圈车道（P6-S1 加，curve_car 用）
#
#  这些数与 campus_map.yaml 的推导关系（与上面 lane 段同一条约定：
#  生成器不解析地图，但**会用这几个数把 curve_car 的整圈航点重新推导一遍
#  逐点对账** —— 航点锚定车道中心线由此机械保证，不靠填的人细心）：
#    half_length_m = loop.length_m / 2 = 90        half_width_m = loop.width_m / 2 = 50
#    corner_radius_m = loop.corner_radius_m = 12   lane_offset_m = lanes.width_m / 2 = 1.75
#  内圈顺时针车道 = 各直道中心线向环内偏 1.75、四角圆弧半径 12 − 1.75 = 10.25。
# -----------------------------------------------------------------------------
loop_lane:
  half_length_m: 90.0
  half_width_m: 50.0
  corner_radius_m: 12.0
  lane_offset_m: 1.75

  # 弧段航点步长，度。npc_controller 的前视被夹在当前线段内，短弧段下退化成
  # 「瞄段端」，切角 ≈ 段长²/(2r)。10° ⟹ 段长 1.79 m ⟹ 切角 ≈ 0.16 m，
  # 在体检判据（对车道中心横向偏差 < 0.3 m）之内。
  # 调大到 15° → 切角 0.35 m，体检会红；调小到 5° → 段长 0.89 m 逼近
  # 到达半径 1.0，航点推进会跳段。
  arc_step_deg: 10

  # spawn 在北直道上的 x。**推导量**：让 curve_car 在 t≈55–59 过 SE 弯。
  # 沿线距 SE 弧入口 4 m/s × 55 s = 220 m = 东路 76 + NE 弧 16.1007 + 北直道剩余
  # ⟹ spawn_x = 78 − 127.8993 = −49.8993。
  # ⚠️ 相位调过两次，都有实测记录（调这个数只挪相位，不挪几何）：
  #    47 s（−17.8993）：弧穿越 t∈[47.2,51.3] 与推导分秒不差，但自车
  #      （目标点 t≈41）还在 30 m 外，带内只有 0.4 s；
  #    51 s（−33.8993）：体检轮带内 3.2 s —— 但余量只有 0.2 s，CP-P6-B
  #      实测轮自车目标点晚了几秒就整个错过（带内弯道样本 0）。
  #    55 s：弧窗对上自车稳定处于弯区的时段（x≈70–91），自车起步抖 ±4 s
  #      全弧仍在 [3,30] m 带内 —— 相位对**抖动**鲁棒，不再贴边设计。
  spawn_x_m: -49.8993

# -----------------------------------------------------------------------------
#  横穿路车流航线（P7-S1 加，cross_car_* 用）
#
#  推导常量，与 campus_map.yaml 的关系（生成器用它们把 route:
#  cross_road_southbound 的航点重推一遍逐点对账，1 mm 容差 ——
#  与 loop_lane 同一条约定：锚定车道中心线靠机械不靠纪律）：
#    north_lane_y_m = +50 − 1.75 = 48.25   北路**东行**车道中心（车流的进场腿）
#    southbound_x_m = 0 − 1.75 = −1.75     横穿路**南行**车道中心
#                                          （campus.xodr 实证：参考线 (0,−39)→(0,39)
#                                          朝 +y，右手交通下南行 = lane +1 = 西侧）
#    south_lane_y_m = −51.75               = lane.ego_center_y_m（j_south 左转并入）
#    turn_radius_m  = 8.0                  = campus_map junction.turn_radius_m
#  路线：北路东行 → j_north 右转（xodr 里 j101_loop_west_to_cross 的走向）→
#        横穿路南下 → j_south 左转（j100_cross_to_loop_east 的走向）→ 南路东行离场。
#  ⚠️ 弧线是**道具自己的**推导（与车道中心线相切、半径 8），不逐点复刻
#     xodr 连接道路的几何 —— 道具是刺激物，判据量的是它与自车的真值间距，
#     不是它压没压线。
# -----------------------------------------------------------------------------
cross_route:
  north_lane_y_m: 48.25
  southbound_x_m: -1.75
  south_lane_y_m: -51.75
  turn_radius_m: 8.0
  # 弧段航点步长，度。与 loop_lane.arc_step_deg 同理：10° 在 r=8 上段长 1.40 m，
  # 前视 4 m 的切角 ≈ 段长²/(2r) = 0.12 m，可接受。
  arc_step_deg: 10
  # 进场/离场端点。−60 给车流留 50 m 的直线进场段（相位窗见 cross_car_a 注释）；
  # +60 让离场车停在自车判据带（30 m）之外。
  start_x_m: -60.0
  end_x_m: 60.0

# -----------------------------------------------------------------------------
#  目标定义
# -----------------------------------------------------------------------------
actors:
  # ---------------------------------------------------------------------------
  #  NPC 车 —— 对向行驶，验速度估计与 ID 跨帧稳定
  # ---------------------------------------------------------------------------
  npc_car:
    classification: vehicle

    # ⚠️ **尺寸不在这里写**，从 config/vehicle_params.yaml 的 geometry 段读。
    #    与自车同一份几何是有意的（SPEC §4.1 的单一来源）：
    #    两份各写一遍的话，感知判据里的「尺寸误差」会把生成器的笔误
    #    算成算法误差，而人会去查聚类参数。
    #    唯一的区别是**没有传感器**，见生成器里的说明。

    # 航点，世界坐标。从东往西开（−x 方向）。
    #
    # ⚠️ 下面这段「9.4 s 后交会」是**旧协议**（自车立即出发）的数，留作
    #    设计意图的记录：现行扩窗协议下自车 t≈41 才起步、交会在 t≈52
    #    （NPC 第 3 趟西行段），见 CLAUDE.md 的 CP-P5-B 协议段。
    #    按旧数排新场景的时序会整个错位（P6-S1 对账时标注）。
    #
    # 起点取 x=105：自车从 x=30 出发、4 m/s，NPC 也 4 m/s 相向而行，
    # 相对速度 8 m/s，约 9.4 s 后在 x≈67 处交会 —— 那时自车已经把速度
    # 提起来了（加速段约 3 s），交会发生在稳态巡航中，量到的速度误差
    # 才是感知的误差而不是混着自车的加速瞬态。
    #
    # 调整时注意：交会点太靠前（自车还在加速）会污染判据；
    # 太靠后（自车已经拐上东侧道路）则两车不在同一条直道上，
    # 相对几何变复杂，遮挡分析也不再成立。
    waypoints:
      - [105.0, -48.25]
      - [20.0, -48.25]
    # CARLA 副本航点（P9-S2 拍板「副本入地图」，第二版）：真车化后路外段
    # = 撞墙卡死；第一版「收进直道两端 U 掉头」实测把引擎撞出 Segfault
    # （真车怼墙旋轮）—— U 掉头方案作废。第二版 = **内圈整环巡回**：
    # 数值全部取自 curve_car 的推导表（route: inner_loop_clockwise），
    # 起点转相到东直道中段，使首次迎面经过南直道落在判据窗内（~21 s）。
    # 全程路内、无掉头、loop 天然闭合。Gazebo 照旧吃上面原航点（冻结）。
    carla_waypoints:
      - [88.2500, -20.0000]
      - [88.2500, -38.0000]
      - [88.0943, -39.7799]
      - [87.6318, -41.5057]
      - [86.8768, -43.1250]
      - [85.8520, -44.5886]
      - [84.5886, -45.8520]
      - [83.1250, -46.8768]
      - [81.5057, -47.6318]
      - [79.7799, -48.0943]
      - [78.0000, -48.2500]
      - [-78.0000, -48.2500]
      - [-79.7799, -48.0943]
      - [-81.5057, -47.6318]
      - [-83.1250, -46.8768]
      - [-84.5886, -45.8520]
      - [-85.8520, -44.5886]
      - [-86.8768, -43.1250]
      - [-87.6318, -41.5057]
      - [-88.0943, -39.7799]
      - [-88.2500, -38.0000]
      - [-88.2500, 38.0000]
      - [-88.0943, 39.7799]
      - [-87.6318, 41.5057]
      - [-86.8768, 43.1250]
      - [-85.8520, 44.5886]
      - [-84.5886, 45.8520]
      - [-83.1250, 46.8768]
      - [-81.5057, 47.6318]
      - [-79.7799, 48.0943]
      - [-78.0000, 48.2500]
      - [78.0000, 48.2500]
      - [79.7799, 48.0943]
      - [81.5057, 47.6318]
