# =============================================================================
#  运动规划参数（ads_planning，P3）
#
#  ⚠️ 这是**唯一**允许定义这些数字的地方（SPEC §7「不允许硬编码魔数」）。
#     消费者是 P3-S5 的 planning_node，它把这些值填进 ads_planning::LatticeParams。
#
#  ⚠️ **车体尺寸不在这里** —— 它们在 config/vehicle_params.yaml，
#     那是车辆参数的唯一来源（SPEC §4.1）。在这儿再抄一份，
#     症状是「改了车宽之后碰撞检查还用旧值」，而没有任何一层报错。
#
#  推导、每个参数调大调小的后果、以及已实现/未实现的边界，
#  见 docs/modules/planning.md。**改这个文件前先读它。**
#
#  ⚠️ L1 单元测试**不读本文件**（读了会把毫秒级测试拖慢并给它一个文件依赖），
#     test_lattice.cpp 里手抄了同一组值。改这里要回去改那里 ——
#     真正的一致性防线在 S5 的 planning_node 参数断言。
#     这与 ads_control / control_params.yaml 是同一套做法。
# =============================================================================

lateral:
  # 终点横向偏移 |d_T| 的上限，单位 m。
  #
  # **这是个推导量，不是拍脑袋的**：= 车道半宽 − 半车宽 = 1.75 − 0.90 = 0.85。
  # 含义是「车轮不压车道线时，车中心最多能偏多少」。
  # 车道宽来自 campus_map.yaml 的 lanes.width_m（3.5），车宽来自
  # vehicle_params.yaml 的 geometry.width_m（1.8）。
  #
  # 调大 → 能绕更宽的障碍物，但会压车道线甚至越入对向 ——
  #        **P3 的 ODD 不允许借道**（那要判断对向来车，是 P7 行为决策）；
  # 调小 → 可绕行的情形变少，更多情况退化成停车。
  max_offset_m: 0.85

  # 候选之间的横向间隔，单位 m。
  #
  # 调大 → 候选变少算得快，但**可能恰好跳过唯一可行的那条缝**。
  #        planning.md §6 的可行区间在典型工况下只有 0.4 m 宽，
  #        步长 0.5 就可能一个可行候选都采不到，于是误报"绕不过去"。
  # 调小 → 候选线性增多，单周期耗时跟着涨。
  offset_step_m: 0.2

longitudinal:
  # 完成横向机动所用的纵向长度 S，采样区间与步长，单位 m。
  #
  # **为什么 S 必须采样而不能固定**：五次式要走到 s = S 才达到 d_T，中途只到一部分。
  # 固定 S = 30 时，s = 10 处只走到 0.21·d_T ≈ 0.17 m —— **近处的障碍物根本绕不开**，
  # 而所有候选看起来都"在往那边走"。让 S 一起采样，才能在「缓而晚」和「急而早」之间选。
  #
  # min 调小 → 能应付更近的障碍物，但曲率变大 → 曲率限速把速度压低，
  #            且转角速率可能顶到限幅（P2-S2 实测的临界车速 v* = R·rate）；
  # max 调大 → 机动更缓更舒适，但整体更迟钝；它同时也是**评估长度**，
  #            调大意味着每周期检查更远的距离，耗时线性增长；
  # step 调大 → 候选变少，但可能跳过唯一能及时绕开的那个 S。
  #
  # min 的物理依据是制动距离：S 至少要大于「以当前速度发现障碍物后停下来的距离」。
  # 园区限速 5.556 m/s、max_decel 1.5 m/s² ⟹ 10.3 m。取 10 m 是贴着这个下界的，
  # **不要再往下调**。lib 层不检查这一条（它要知道车速，那属于纵向 S4）。
  min_horizon_m: 10.0
  max_horizon_m: 30.0
  horizon_step_m: 10.0

trajectory:
  # 输出轨迹的点距，单位 m。与 map_node 的 path_sample_step_m 取同一个值，
  # 这样规划轨迹和全局路径在下游有同样的插值精度。
  # 调大 → 下游插值误差大；调小 → 消息变大、单周期耗时涨。
  resample_step_m: 0.5

safety:
  # 车体外廓到障碍物外廓的最小允许间距，单位 m。
  #
  # ⚠️ **这个数来自 SPEC §8 场景 S04（「侧向间距 > 0.5 m」），不是在本模块发明的。**
  #    它是**准入条件不是代价项** —— 不满足的候选直接淘汰，
  #    不允许"够便宜就擦着过"。放进代价里等于把安全逻辑放进一个
  #    可被权重绕过的分支，CLAUDE.md 明令禁止。
  #
  # 调大 → 更安全，但可绕行的情形急剧变少：它在 §6 的可行性不等式
  #        （o_l ≤ W/2 − w − g）里是直接扣掉的一项，加 0.1 就少 0.1 m 的余地；
  # 调小 → 传感器误差或定位漂移一来就变成实际碰撞。
  margin_m: 0.5

  # **停车点**到障碍物的额外纵向裕度，单位 m。与 margin_m 是两回事：
  # margin_m 是侧向擦过时的间距判据（SPEC §8 S04），
  # 这一条是正面停住时车头要留多远。
  #
  # 取 1.0 m：比侧向判据大一倍，因为正面停车的误差来源更多 ——
  # 制动偏差、定位漂移、以及障碍物包围盒本身的估计误差都作用在同一个方向上，
  # 而侧向擦过时车还在动、有机会在下一周期修正。
  #
  # 调大 → 停得更保守，但在窄路上更容易"还没到就停了"；
  # 调小 → 停车点更靠前，上述任一误差一来就顶上去。
  stop_margin_m: 1.0

speed:
  # ⚠️ **本段在 P3-S4 从 config/control_params.yaml 的 `profile:` 段搬来。**
  #    参数要跟着**用它的代码**走 —— 速度剖面已经移到 ads_planning，
  #    参数留在控制那边的话，改它的人会以为自己在调控制器。
  #
  # 巡航速度、最大加减速**不在这里**：它们是**车辆能力**，在 vehicle_params.yaml，
  # 由 launch 搬运给 planning_node。在这儿再抄一份就是 SPEC §4.1 的「行为漂移」温床。
  # 过弯的横向加速度上限 a_lat_max，单位 m/s²。速度剖面按
  # v = min(v_cruise, √(a_lat_max/|κ|)) 逐点限速。
  #
  # 1.5 → R=8 的路口转弯车道限速 3.464 m/s（12.5 km/h）。
  # 对照：定速 20 km/h 过那个弯，横向加速度是 **3.86 m/s²**，紧急变道的量级 ——
  # 园区接驳车上站着的人会扶不住。舒适区 1.5–2.0。
  #
  # ⚠️ **它与转向速率限幅耦合，调大不只是"过弯快一点"。**
  #    入弯所需的转向速率就是 v/R，所以限幅起作用的临界车速是
  #    v* = R · max_steer_rate_rad_s = 8 × 0.5 = **4.0 m/s**。
  #    而 a_lat_max = 2.0 给出的限速 √(2.0×8) **恰好就是 4.0** —— 正好顶在临界值上。
  #    见 docs/modules/control.md §3.7。
  #
  # ⚠️ 运动学模型**不体现轮胎打滑**：调到 5 以上仿真里"能过"而真车会失控。
  max_lateral_accel_mps2: 1.5

cost:
  # 贴中心线的倾向，乘 d_T²。
  # 调大 → 绕行更晚更急；调小 → 无事也偏着走，白白占用横向余量。
  weight_offset: 1.0

  # 平滑度，乘 ∫κ²ds。
  #
  # **只有在 S 也被采样时这一项才有意义** —— 若 S 固定，∫κ²ds 与 d_T²
  # 都随 |d_T| 单调增，两者永远不会给出相反的排序，该项完全冗余。
  # 有了 S 的采样，它才是「别为了早点绕开就猛打方向」这个偏好的载体。
  weight_curvature: 5.0

  # 远离障碍物的倾向，乘 1/最小间距。无障碍物时最小间距是 +∞，该项自然为 0。
  # 调大 → 离障碍物更远，但更容易顶到车道边界（max_offset_m）；
  # 调小 → 贴着 safety.margin_m 走，传感器误差一来就变成碰撞。
  weight_clearance: 0.1

  # 与上一周期的一致性，乘 (d_T − 上周期 d_T)²。抑制上下周期跳变。
  #
  # ⚠️ **必须 < weight_offset，否则车绕完障碍物回不到中心线。** 这是可推导的：
  #    从偏移 (k+1)·h 回到 k·h 时，偏移代价降 w_offset·h²(2k+1)、
  #    一致性代价升 w_consistency·h²。最难的一步是 k = 0（从 h 回到 0），
  #    此时净收益为负（即愿意回中心）当且仅当 **w_consistency < w_offset**。
  #    取 0.5 相对 1.0 留了两倍余量。
  #
  # 超过这个界的症状很隐蔽：**车绕过障碍物之后永久停在某个偏移上**，
  # 全程不报错、轨迹平滑、也不压线 —— 只是从此再也不走车道中心了。
  #
  # 调小 → 上下周期跳变，车在障碍物前左右摇摆。
  weight_consistency: 0.5
