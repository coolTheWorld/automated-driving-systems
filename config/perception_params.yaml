# =============================================================================
#  感知参数（P5-S5）
#
#  ⚠️ 这里只放**「我们想怎么感知」**，不放**「传感器能做什么」**。
#     雷达的线数、视场、量程在 config/vehicle_params.yaml 的 sensors.lidar，
#     两者的分工与 control_params / vehicle_params 完全同构：
#     混在一起的话，换一个雷达要来这里翻参数，而那正是 SPEC §4.1
#     「行为漂移」的温床。
#
#  ⚠️ **下面标了「安全关键」的两个参数不是普通调参项。**
#     它们调错不会报错，只会让目标在某个距离上**静默消失**，
#     而现场表现是「车快撞上了才开始绕」—— 看起来像规划器反应慢。
# =============================================================================

ground:
  # RANSAC 迭代次数。地面点占比 p≈0.5 时，100 次里至少一次三点全中的
  # 概率是 1−(1−0.125)¹⁰⁰ ≈ 1−1.4e-6。
  # 调小到 20 → 概率掉到 93%，也就是**每 14 帧就有一帧找不到地面**。
  max_iterations: 100  # P9-S2 曾抬到 300（墙切片让坡度门拒绝中位 73/100）；撤墙后 CARLA 拒绝中位 1、Gazebo 本就是 100 的基线 —— S5a A/B 后回到 100（见 perception.md §1）

  # 内点距离阈值，m。雷达测距 σ=1 cm，但路面板本身有 0.01 m 厚，
  # 且远处的点受角分辨率影响。
  # 调小到 0.05 → 远处地面点被判成障碍物（虚警）；
  # 调大到 0.40 → **矮障碍物被吞进地面**（锥桶才 0.8 m 高）。
  # 0.15 → 0.20（P9-S2 轮 9）：CARLA 生成路面的接缝残差骑在 0.15 线上，
  # 漏成近地薄条 —— 它们在**聚类层**把目标点桥接进墙巨簇（clusters 恒=2、
  # 全部目标 0% 的机制闭合；剃刀门在 fit 层救不了聚类层）。0.20 仍远离
  # L1 反例圈出的危险区（0.4 吞 0.8 m 锥桶）。
  distance_threshold_m: 0.20

  # 候选平面允许的最大坡度，rad（0.12 ≈ 6.9°）。
  # ⚠️ 不检查的话**一堵墙会赢**（立面上的点又多又共面），
  #    选中墙之后真正的地面全变成障碍物，聚类会连成一个几十米的巨簇。
  # 0.26 → 0.12（P9-S1 实测，2026-08-15）：CARLA 生成世界的护栏墙给了
  # RANSAC 一族**斜切平面**（一头搭路面、一头搭墙带，11.8° < 旧门 15°，
  # 内点 0.61 比真路面还多）——地面分割在两族平面间**双稳态翻转**，
  # 时对时错正是「检测率 0-6% 而非恒 0」的形态。斜切够到墙顶需 ≥9.9°，
  # 0.12 rad（6.9°）把整族杀死；L1 的 1/3/5° 坡度扫描留 1.9° 余量。
  # ODD（SPEC §2）园区道路坡度远小于此，不牺牲任何合法场景。
  max_slope_rad: 0.12

  # 只在这个高度以下找地面，m。防止把车顶或货箱顶面当成地面。
  max_height_m: 1.0
  min_inliers: 100

cluster:

  # 检测框最小水平尺寸门，m（P9-S2）。CARLA 生成路面的接缝几何漏成
  # 0.03 m 宽的单环弧段簇（374 帧车道内虚警的主体）；ODD 最小目标 0.4。
  # 调大 → 贴 0.4 时行人侧视薄框有被吞的风险；调小 → 剃刀条回来。
  # ⚠️ 名义在 cluster 段、实际作用在 L-Shape 拟合之后（量的是框不是簇）。
  # 0.1 → 0.25 → 0.15 → 0.1（P9-S2 轮 8 终值）：0.25 误伤行人包络、0.15
  # 仍剃 10 m 外的稀疏剖面（波束稀释让 L-Shape 宽缩到 0.1-0.15 骑线 ——
  # 轮 2 门=0.1 时 10-15 m 行人 31-35% 是直接证据）。墙退 6 m 后当年逼门
  # 抬高的 0.18-0.22 条族已灭，残余 0.04 细条 0.1 门拦得住。walker 网格
  # 的侧向剖面实测 0.15-0.25（ODD 的 0.4 是包络不是剖面！），10 m 外行人
  # 检测率从 31-53% 直接归零。墙退 6 m 后残余细条只剩 0.04 宽，0.15 够拦。
  # ⚠️ 「按 ODD 包络设门」对 L-Shape 的**剖面**语义是错的 —— 正对/侧对
  # 给的是投影，与 tracker 那条「长宽命名与目标无关」同源。
  min_extent_m: 0.1

  # 剃刀门的第二个条件：竖向延展上限，m（2026-08-15，P9 Gazebo 回归案）。
  # 「薄」单独不是剃刀条的充分条件 —— 正对的盒状目标（Gazebo 车尾/行人侧面）
  # 只露一个面，L-Shape 的深度只剩雷达噪声（实测 min(l,w) p50 0.047），
  # 单条件门每帧把跟车目标吞光（A/B：门 0.1 撞车 −5.19 m；门 0 全绿）。
  # 剃刀条是一维的：接缝残留一环点，z_max−z_min ≈ 0；目标面 ≥ 0.8（锥桶）。
  # 只有「薄 且 矮」才剃。0.3 = 接缝残留可能占到的两环竖向散布之上，
  # ODD 最矮目标（锥桶 0.8）之下 —— 两头各留 ≥ 0.2 的空档。
  # 调大 → 逼近 0.8 会再次吞矮目标（锥桶）；调小 → 双环接缝条漏回来（CARLA 侧
  #        要用 p9_capture_frame 复扫确认，条族竖向延展实测值待补）。
  razor_max_height_m: 0.3

  # 浮空碎片门（P9-S5c，2026-08-16）：底离地 ≥ floating_min_bottom_m **且**竖向延展
  # < floating_max_height_m 的簇不成检测。ODD 里没有悬空目标；这样的簇只能是更高
  # 物体的**水平表面碎片** —— 实测就是车顶远端那一环：雷达 2.2 m、车顶 1.5 m，
  # 10 m 处相邻两线落在车顶上相距 ~2 m > 聚类容差 0.5，远端环自成一簇
  # （0.9×0.5×0.03，底 1.48），随车 4 m/s 走、三帧确认、躲在本车框后遮挡滑行免死，
  # 掉头时靠重锚补全偷走整车检测 —— U 转鬼影 + ID 切换的上游（perception.md §6.7）。
  # 1.0：落地目标 30 m 内最低一环离地 ≤ 地面阈值 0.2 + 线间距 0.59 = 0.8，
  #      再留 0.2 余量；车顶碎片底 ≈ 车高 1.47–1.5，两头空档各 ≥ 0.2。
  #      调小到 0.8 以内 → 30 m 处只剩上面两环的车/行人可能被吞；调大 → 逼近车高，
  #      车顶碎片漏回来（症状回到 U 转鬼影）。
  # 0.3：与剃刀门同一个「延展 ≈ 0 的表面片」尺度；墙后只露上半身的行人延展 0.7 不受影响。
  #      调大 → 开始吞被遮挡目标的可见上部。
  floating_min_bottom_m: 1.0
  floating_max_height_m: 0.3
  # ⚠️⚠️ **安全关键。** 邻域半径，m —— 被雷达线间距从下面顶着。
  #
  # 32 线 / 垂直 FOV 35° ⟹ 线角间隔 1.129°，于是距离 d 处的线间距：
  #     20 m: 0.394   25 m: 0.493   30 m: 0.591
  # 小于线间距 → 同一目标被**按扫描线拆碎**，每片都凑不够 min_cluster_size
  # ⟹ **目标整个消失**（比拆成两个更危险，后者至少还看得见）。
  # 另一侧：判据要求相距 1.0 m 的两个目标必须分开，所以要 < 1.0。
  #
  # 取 0.5：覆盖到 25 m，对 1.0 m 判据留 2 倍余量。
  # 代价是 30 m 外拆簇 —— 那是角分辨率的直接后果，不是参数没调好。
  tolerance_m: 0.5

  # 竖向邻域半径（P9-S3a，2026-08-15）。上面那笔账的两侧不在同一个方向上：
  # 顶着下界的是**竖向**线间距，要守住的 1.0 m 分辨力是**水平**的 —— 拆开给。
  # 实现是聚类前把 z 乘以 tolerance/vertical_tolerance（椭球邻域）。
  #   · 纯竖向相邻两线的连通极限 25.4 m → 50.8 m（≥ 量程）
  #   · 相邻两线之间的**进深台阶**（真车正面：保险杠→格栅→引擎盖不是平板）
  #     25 m 处可连的台阶从 0.10 m 放宽到 0.44 m —— CARLA micra 正对驶来 23–33 m
  #     断成两簇、跟踪器在两条之间摆（ID 切换 4–6、近边 ±1 m）的病根；
  #     Gazebo 平板车 25–30 m 档 90–92% 同源。
  #   · 水平方向一个字没缩：并排 1.0 m 的两个目标照旧分开。
  # 调大 → 竖直 1.0 m 内叠放的东西并簇（园区 ODD 无悬空物）；等于 tolerance_m 时
  # 退化为 P5 验收时的各向同性行为。
  vertical_tolerance_m: 1.0

  # ⚠️⚠️ **安全关键。** 成簇的最小点数，由 S1 的**实测**定：
  #     scripts/check_perception_input.py（2026-08-11，命中帧的中位点数）
  #     锥桶 20–25 m: 7 点 | 行人 20–25 m: 7 点 | NPC 车 20–25 m: 40 点
  # 取 5 保住 20–25 m 的锥桶与行人（留 1.4 倍余量）。
  # 调到 10 → 它们在 20 m 外**直接看不见**。
  min_cluster_size: 5

  # 超过它的簇被丢弃。一帧才 2–5 万点，一个占近半数点的"目标"
  # 只可能是地面分割失败 —— 宁可丢掉也不要给下游一个几十米长的障碍物。
  max_cluster_size: 20000

lshape:
  # 朝向搜索的角步长，rad（0.01745 = 1°）。矩形有 90° 周期，只搜 [0, π/2)。
  # 判据要求朝向误差 < 10°，1° 的量化误差留了 10 倍余量。
  angle_step_rad: 0.01745
  # 少于这么多点就不拟合。取 4（三点必定共面，任何朝向都能"完美贴合"）。
  # ⚠️ 不要因为"想更稳"调到 10 —— S1 实测锥桶/行人在 20–25 m 只有 7 点，
  #    调大等于让它们在那个距离上失去朝向。朝向不可靠时下游还能退回用
  #    轴对齐包围盒，而目标整个消失就没得救了。
  min_points: 4

tracker:
  # 过程噪声：**加速度**标准差，m/s²。恒速模型假设目标不加速，实际会 ——
  # 这个量就是"允许它多不守规矩"。取 2.0（园区目标的量级）。
  process_accel_stddev_mps2: 2.0

  # 观测噪声：检测位置的标准差，m。
  # ⚠️ 取 0.3 而不是 S2 实测的 0.003 —— 那 0.003 是**可见面**的定位精度，
  #    而检测给的是包围盒中心，它随目标朝向与遮挡变化（雷达打不到背面），
  #    帧间抖动远大于面的定位精度。
  measurement_stddev_m: 0.3

  # 关联门限：马氏距离平方上限。9.21 = χ²(2, 99%)。
  # ⚠️ **这次可以查卡方分布表**，因为协方差是滤波器按已知的 Q/R 递推出来的
  #    —— 与 P4 那个未标定的 NDT 协方差不同（那里只能用固定阈值，
  #    见 docs/modules/localization.md §10.6）。同一个词在两处的可用性不同。
  gate_chi_square: 9.21

  # ⚠️⚠️ 累计命中多少次才算确认。**不要求连续** —— 这一条直接来自 S1 实测。
  #
  # S1 体检：目标在连续帧之间**闪烁**，命中率只有 33–74%。按 p=0.5 算，
  # 「连续 3 帧命中」的概率只有 12.5%，平均要等 8 次机会（0.8 s）才确认 ——
  # 而目标可能只在视野里待几秒。**那不是保守，是看不见。**
  confirm_hits: 3

  # 连续未命中多少帧就删除。取 5（0.5 s）：p=0.5 时误删概率 3.1%。
  # 调小到 3 → 误删概率 12.5%，闪烁场景下 ID 会频繁跳变；
  # 调大到 10 → 目标走了还留着"幽灵航迹"，而规划会绕它。
  max_misses: 5

  # 速度超过它才用来消歧朝向，m/s。
  # ⚠️ 低于这个速度，速度方向由噪声主导 —— 拿噪声去定朝向还不如老实说
  #    "不知道"。静止目标的车头朝向**物理上无解**，猜错的概率 50%，
  #    而错了之后 P6 会预测出一条逆行轨迹。
  heading_min_speed_mps: 0.5

  # 补全/重锚单次位移的物理上限，m（P6-S0 实测加的关联虫洞闸）。
  # = ODD 最大目标（车 4.4 m）的一半。墙沿碎片的 L-Shape 帧间剧变
  # （0.03 ↔ 6 m）曾把 5.9 m 外另一个碎片"拉进"卡方门限，焊出一条
  # 9–12 m/s 假速度的航迹并借遮挡滑行横穿车道（车道内幻影的真身）。
  # 调大到 3.5 → 虫洞重新打开；调小到 1.0 → 车侧面刚露出的合法重锚
  # （1.3 m）被拒，ID 在 17–22 m 反复切换的老毛病回归。
  anchor_shift_max_m: 2.2

  # 遮挡滑行的速度准入上限，m/s。= ODD 设计最高车速 30 km/h（SPEC §2）。
  # 滑行是在**外推**状态 —— 外推一个物理上不可能的状态就是在制造幽灵
  # （实测 11.9 m/s 的假航迹靠滑行免死 3 s、飞越 35 m）。
  # 调小到 3 → 正常行驶的车一被遮挡就换 ID，退化回滑行规则要解决的冲突。
  coast_max_speed_mps: 8.33

# 点云比这么旧就丢，s。与 localization_node 那条同一个理由：
# 用旧帧算出来的障碍物位置对应的是**过去**的时刻，而下游会当成现在的。
max_cloud_age_s: 0.15
