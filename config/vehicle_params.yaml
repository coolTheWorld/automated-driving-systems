# =============================================================================
#  自车物理参数 —— 双仿真环境的唯一来源（SPEC §4.1 强制要求）
#
#  ⚠️ 这是**唯一**允许定义这些数字的地方。
#
#     Gazebo 侧：models/ego_vehicle/model.sdf 由 scripts/gen_vehicle_model.py
#                从本文件生成，不要手改生成物。
#     CARLA 侧：P0b 的 carla_bridge 用 PythonAPI 的 apply_physics_control()
#                把 CARLA 车辆调到与本文件一致。
#
#  为什么这么较真：SPEC §4.1「双环境的头号风险：行为漂移」。
#  两套仿真的车辆动力学一旦不一致，症状是**本地调好的控制参数一上 CARLA 就震荡**，
#  而你无法判断到底是算法错了还是环境不同 —— 这是最难查的一类 bug。
#  各写一份参数是产生这种不一致最常见的原因。
#
#  所有键名带单位后缀，不留任何猜测空间。角度一律用弧度（ROS 惯例）。
# =============================================================================

# 车型定位：园区低速乘用车尺寸。参数取自紧凑型轿车的典型值，
# 不追求对应某款真车 —— 重要的是两个仿真环境用**同一组**数字。
name: ego_vehicle

geometry:
  # 轴距。自行车模型 / Ackermann 几何 / Stanley 控制器都直接用这个值，
  # 是全部参数里对控制行为影响最大的一个。
  wheelbase_m: 2.700
  # 轮距（左右轮中心距）。影响转向几何与侧倾。
  track_width_m: 1.550

  # 整车外廓包络。规划/感知做碰撞检查时用这三个数。
  # 注意 width_m 是**含轮胎的保守值**：SDF 里车体盒实际按「轮距 - 轮宽」建，
  # 剩下的宽度由车轮的碰撞体补上，总和略小于 1.8 —— 偏保守，方向是对的。
  length_m: 4.400
  width_m: 1.800
  height_m: 1.500

  # 前后悬。length = wheelbase + front_overhang + rear_overhang
  front_overhang_m: 0.850
  rear_overhang_m: 0.850

  # 质心离地高度。偏高会让车在转弯时侧倾明显甚至翻车；
  # 真车约 0.5-0.6 m，这里取 0.55 m。
  # 注意它不等于车体几何中心高度 —— 真车的质量集中在下半部。
  com_height_m: 0.550

  # 离地间隙（车体底盘下沿离地高度）。决定车体碰撞盒的下边界，
  # 太小会让底盘蹭到地面产生莫名其妙的接触力。
  ground_clearance_m: 0.160

wheel:
  radius_m: 0.310
  width_m: 0.200
  mass_kg: 15.0

mass:
  # 整备质量。含四个车轮。
  total_kg: 1500.0

sensors:
  # 传感器**外参**（安装位姿），相对 base_link = 后轴中心、地面高度。
  #
  # 为什么外参也必须在这里而不是写进 SDF：
  # 它同时被三个地方消费 —— Gazebo 的 model.sdf、ROS 的 URDF（决定 TF 树）、
  # 以及 P0b 的 carla_bridge（在 CARLA 里 spawn 传感器）。三份各写一遍，
  # 症状是**同一段点云在两个仿真里落在不同的位置**，而这在 RViz 里看不出来，
  # 要等到 P4 定位配准怎么调都差 1 m 才会暴露。

  lidar:
    # 装在车顶前部：x 取轴距中点，前后视野均衡；z 比车高（1.5）再高 0.1 m。
    # 往前挪能减少车头自遮挡，但会让车尾盲区变大 —— 园区场景要倒车，取中间值。
    mount_x_m: 1.350
    mount_y_m: 0.000
    mount_z_m: 1.600

    # 32 线。线数翻倍 → 点数翻倍 → GPU 渲染耗时和 RTF 一起下降；
    # 线数减半则远处目标可能一根线都打不到（见下面的垂直分辨率账）。
    channels: 32

    # 水平方向每圈采样数。1800 → 360°/1800 = 0.2°/点。
    # 50 m 处相邻两点的横向间隔 = 50 × 0.2° ≈ 0.175 m，够分辨行人宽度。
    horizontal_samples: 1800

    # 垂直视场：下压 25°、上仰 10°，共 35° 分给 32 线 → 约 1.09°/线。
    #
    # 为什么不对称：园区低速车关心的是近处地面和矮障碍，不是天上。
    #   下压角决定近处地面盲区：最低线打到地面的距离 = 1.6 / tan(25°) ≈ 3.4 m。
    #   下压角改小到 15°，盲区扩大到 6.0 m —— 车 5 m 外的地面全看不见，
    #   低速场景下这是致命的。
    #   下压角再加大则远处线数被浪费在近处地面上。
    #
    # 垂直分辨率的代价要有数：50 m 处相邻两线的高度差 = 50 × tan(1.09°) ≈ 0.95 m。
    # 也就是说**一个 1 m 高的障碍在 50 m 处只能被大约 1 根线扫到** ——
    # 这是所有旋转式激光雷达的固有性质，P5 做检测时远距离目标点数少不是 bug。
    vertical_fov_min_rad: -0.4363   # -25°
    vertical_fov_max_rad:  0.1745   # +10°

    # 量程。上限 50 m 取自 SPEC §2 ODD（园区，30 km/h 以内）：
    # 30 km/h ≈ 8.3 m/s，50 m 相当于 6 s 的反应距离，足够。
    # 下限 0.5 m 是为了滤掉打在自车车顶上的返回。
    range_min_m: 0.5
    range_max_m: 50.0

    # 扫描频率。10 Hz 是机械旋转式雷达的行业惯例（对应 600 rpm）。
    # 调高 → 时间分辨率好但 GPU 负载线性上升；调低 → 车动起来后两帧间
    # 位移变大，点云畸变（运动畸变）更明显。
    update_rate_hz: 10.0

    # 测距噪声标准差。真实雷达 2-3 cm，这里给 1 cm 偏乐观 ——
    # P0a 阶段先把数据流打通，噪声模型等 P5 做感知时再对齐真实器件。
    noise_stddev_m: 0.010

  imu:
    # ⚠️ IMU 故意装在 base_link 原点（0,0,0）且不旋转。
    #
    # 这不是偷懒，是为了让 SPEC §4.1 的「/imu 在 base_link 系」**天然成立**：
    # IMU 一旦偏离原点，它测到的加速度里就混进了杠杆臂效应
    # （车绕 z 轴以 ω 转动时，距原点 r 处会多出 ω²r 的向心加速度），
    # 要换算回 base_link 必须知道角加速度并做一次刚体运动学补偿。
    # 那是 P4 定位模块该做的事，不该是 P0a 桥接层的负担。
    #
    # 真车做不到这一点（IMU 有实际安装位置），所以 P4 接实车/CARLA 数据时
    # 这条补偿是要补的 —— 届时改这里的 mount_* 即可复现该问题。
    mount_x_m: 0.000
    mount_y_m: 0.000
    mount_z_m: 0.000
    update_rate_hz: 100.0           # 惯性器件要远高于雷达，100 Hz 是常见下限

  gnss:
    # GNSS 天线在车顶后部。天线位置对定位有实际影响（杠杆臂同样存在），
    # 但 NavSatFix 传的是经纬度，杠杆臂修正属于 P4 的活儿。
    mount_x_m: 0.500
    mount_y_m: 0.000
    mount_z_m: 1.600
    update_rate_hz: 10.0

limits:
  # 前轮最大转角。乘用车实际约 30-35°，取 0.60 rad ≈ 34.4°。
  # ⚠️ CARLA 的车辆蓝图默认值常被夸大到 70°，P0b 对齐时必须覆盖掉。
  max_steer_angle_rad: 0.600
  # 转向执行机构的角速度上限，防止控制器下发阶跃指令时车头瞬间甩动。
  #
  # ⚠️ 它是**给控制器的预算**，不是仿真器会替你执行的约束。
  #    Gazebo 的 AckermannSteering 插件没有转向速率限幅这个概念
  #    （插件只认 steer_p_gain 一个动力学参数），CARLA 侧同理。
  #    真正实现这条限幅的是 ads_control 的 StanleyController ——
  #    见 docs/modules/control.md §3.7。
  #    执行机构**能多快跟上**这些指令是另一件事，见下面的 actuator 段。
  max_steer_rate_rad_s: 0.500

  # 速度上限来自 ODD（SPEC §2）：设计最高 30 km/h，常用巡航 15-20 km/h。
  max_speed_mps: 8.333        # 30 km/h
  cruise_speed_mps: 5.556     # 20 km/h

  # 加减速限值。舒适性区间，不是物理极限 ——
  # 规划器用它约束速度曲线，控制器用它做指令限幅。
  max_accel_mps2: 1.500
  max_decel_mps2: 3.000
  # 紧急制动才允许突破 max_decel，仅由安全模块触发。
  emergency_decel_mps2: 5.000

# =============================================================================
#  执行机构动力学
#
#  与 limits 段的分工：limits 是「**允许**下发多大」，actuator 是「下发之后
#  **多久到位**」。两者都是车辆属性，都必须两个仿真环境一致 ——
#  但它们是**独立**的两件事，混为一谈会得到一个"限幅写着 0.5 rad/s、
#  实际却要 1.2 s 才转到位"的车（P2-S4 实测踩到的就是这个）。
# =============================================================================
actuator:
  # 转向执行机构的一阶响应时间常数，单位 s。
  #
  # 物理含义：给一个转角阶跃，实际转角按 1 − e^(−t/τ) 逼近目标，
  # τ 就是到达 63% 所需的时间。真车电动助力转向的带宽约 2–5 Hz，
  # 对应 τ ≈ 0.03–0.08 s，这里取中间值。
  #
  # ⚠️ **这个参数是 P2-S4 的 CP-P2-B 逼出来的，不是拍脑袋加的。**
  #    此前 SDF 从没设过 AckermannSteering 的 steer_p_gain，用的是插件默认值
  #    1.0，实测 τ = **1.198 s** —— 比 Stanley 自己的闭环时间常数
  #    （1/k_e = 1.0 s）还大。被控对象比控制器慢，弯道横向误差因此在
  #    ±0.8 m 之间震荡，而同一条弯在 L1 的运动学模型上只有 1.6 cm。
  #    L1 里执行机构是瞬时的，**结构上不可能预测到这一条**。
  #
  # 调大（→ 0.2 s）→ 转向绵软，Stanley 的相位裕度被吃掉，重新震荡；
  # 调小（→ 0.01 s）→ 更接近理想，但 steer_p_gain = 100，
  #   大误差时会向关节下发上百 rad/s 的速度指令，求解器容易抖。
  #
  # 由 scripts/gen_vehicle_model.py 推导出 SDF 的 <steer_p_gain> = 1/τ。
  # **不要直接在 SDF 里写增益** —— 增益是求解器的实现细节，
  # 时间常数才是能拿去和 CARLA / 真车对齐的物理量（SPEC §4.1）。
  #
  # ⚠️ **这个数不等于实测的端到端响应时间**，因为插件的关节速度环还有
  #    大约 **0.24 s 的地板**，调这个参数动不了那一部分。实测（阶跃 0.3 rad）：
  #
  #      τ 参数    steer_p_gain   实测 63% 上升时间
  #      （默认）        1.0          1.198 s
  #      0.050         20.0          0.294 s      ← 当前取值
  #      0.020         50.0          0.255 s      ← 2.5 倍增益只换来 13%
  #
  #    所以取 0.050：它拿到了可改进量的绝大部分，而增益还只有 20 ——
  #    再往上是在跟地板较劲，代价是大误差时向关节下发上百 rad/s 的速度指令。
  #    **要知道实际有多快，跑 scripts/probe_steering_response.py 量，不要读这个数。**
  steer_response_time_s: 0.050
