# =============================================================================
#  CI —— 每次 push / PR 自动跑构建、lint、L1 单元测试
#
#  ## 这里**不跑** Gazebo，原因有两条，第二条才是决定性的
#
#  1. GitHub Actions 的免费 runner 没有 GPU，跑 Gazebo 只能软件渲染（llvmpipe），
#     RTF 会掉到 0.1 以下，任何带时间判据的测试都不可信。
#  2. **现阶段根本没有 L3 场景测试可跑。** S5 只做了 L1 样板，L3 要等 P2 有了
#     「规划→控制→车动起来」的闭环才有意义。
#
#  所以现在跑的是"不需要仿真器就能验证的一切"：构建、lint、L1 单元测试、
#  生成物同步检查。这四项覆盖了绝大多数回归，且全程分钟级。
#
#  ⚠️ 等 P2 有了 L3-G 场景测试，要把它加进来 —— CLAUDE.md 里说的
#  「本地 Gazebo 能进 CI 是双环境方案最被低估的收益」指的就是那一步。
#  CARLA 永远进不了 CI（要 GPU、20 GB 镜像、跑不确定）。
#
#  ## 为什么用项目自己的 Dockerfile 而不是 action-ros-ci 之类的社区 action
#
#  这个项目把"环境漂移"列为头号风险（SPEC §4.1）：本地 Gazebo 和云端 CARLA
#  共用同一个 Dockerfile 就是为了防它。CI 再换一套环境就是引入第三套 ——
#  于是"本地过了 CI 不过"变成常态，而且查不出是代码问题还是环境问题。
#  代价是 CI 慢几分钟，用 GHA 层缓存后只有改 Dockerfile 时才真正重建。
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上新的 push 会取消还在跑的旧任务，省 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 正常跑完约 5-10 分钟（镜像有缓存时更快）。设 30 分钟是为了让"卡住"
    # 这种故障能在半小时内暴露，而不是占满默认的 6 小时。
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # runner 的 UID/GID 要传进镜像。容器内的 dev 用户必须和 runner 同 UID，
      # 否则挂载进去的 workspace 写不了，colcon build 会以权限错误失败。
      # 这和本地 scripts/setup_env.sh 做的是同一件事，只是本地取的是你的 UID。
      - name: 取 runner 的 UID/GID
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # cache-from/to type=gha 把镜像层存进 GitHub Actions 缓存。
      # 只要 Dockerfile 和它依赖的 apt 源没变，后续跑就是秒级命中。
      - name: 构建开发镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ads-dev:jazzy
          load: true
          build-args: |
            UID=${{ env.HOST_UID }}
            GID=${{ env.HOST_GID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # 生成物同步检查 —— 放在编译**之前**，因为它最快且最容易被忘
      #
      # config/vehicle_params.yaml 是车辆参数的唯一来源，SDF 和 URDF 都是从它
      # 生成的（SPEC §4.1）。改了 YAML 忘了重新生成，症状是 RViz 里点云和车模型
      # 对不上、或者 TF 报的外参与 Gazebo 里实际安装位置差几厘米——下游全部
      # 配准带着这个偏差却没有任何报错。这一步就是拦它的。
      # ---------------------------------------------------------------------
      - name: 校验 SDF/URDF 与 vehicle_params.yaml 同步
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ads-dev:jazzy \
            python3 scripts/gen_vehicle_model.py --check

      # ---------------------------------------------------------------------
      # 同理，地图也有三个生成物：maps/campus.xodr（两环境共用的车道语义）、
      # models/campus_road/model.sdf（Gazebo 里看到的路面）、
      # src/ads_map/test/data/reference_samples.csv（C++ 逐点对账的基准）。
      #
      # 三者漂移的症状各不相同，但都不报错：
      #   语义 vs 路面漂移 → 车沿一条肉眼看不见的车道压着绿化带走；
      #   采样基准没跟着重新生成 → CP-P1-A 拿旧基准对账，给出**虚假的通过**。
      # 后者尤其危险，所以它同时也进了 colcon test（本地就能拦，不用等 CI）。
      # ---------------------------------------------------------------------
      - name: 校验地图生成物与 campus_map.yaml 同步
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ads-dev:jazzy \
            python3 scripts/gen_map.py --check

      - name: 构建工作空间
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ads-dev:jazzy bash -c '
              set -e
              set +u; source /opt/ros/jazzy/setup.bash; set -u
              colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
            '

      # ---------------------------------------------------------------------
      # 测试 + lint
      #
      # ⚠️ 必须用 `colcon test-result` 判定成败，不能只看 `colcon test` 的退出码。
      #    colcon test 反映的是"测试有没有跑起来"，测试**失败**它照样可能返回 0。
      #    只看它的话，CI 会在测试全红的情况下显示绿灯——比没有 CI 更危险。
      #    这里两道都上：--return-code-on-test-failure 加事后 test-result。
      # ---------------------------------------------------------------------
      - name: 测试与 lint
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ads-dev:jazzy bash -c '
              set -e
              set +u; source /opt/ros/jazzy/setup.bash; set -u

              colcon test --return-code-on-test-failure
              colcon test-result --all --verbose

              # 第三道：断言确实跑了测试。
              #
              # 前两道都挡不住「一个测试都没被发现」这种情况：
              # colcon test 没东西可跑会成功返回，colcon test-result 在结果为空时
              # 也返回 0（输出 "Summary: 0 tests"）。于是 CI 显示绿灯，实际零覆盖。
              # 这种假绿比没有 CI 更危险 —— 它会让人以为改动被验证过了。
              #
              # 触发场景不是假想：包名写错、CMakeLists 里漏了 BUILD_TESTING 分支、
              # 或 ament_add_gtest 换成裸 add_test（不生成 xunit XML），
              # 都会让测试数悄悄归零而其它一切正常。
              SUMMARY=$(colcon test-result --all | tail -1)
              echo "汇总：${SUMMARY}"
              COUNT=$(echo "${SUMMARY}" | grep -oE "[0-9]+ tests?" | grep -oE "[0-9]+" || echo 0)
              if [ "${COUNT}" -lt 1 ]; then
                echo "✗ 一个测试都没跑起来。退出码是绿的，但什么也没验证。"
                exit 1
              fi
              echo "✓ 实际跑了 ${COUNT} 个测试"

              # 第四道：断言**那个不需要 GPU 的端到端闭环**确实跑了（L3-G，P2-S5）。
              #
              # 上面第三道只保证"至少有一个测试"，挡不住「**某一个**测试被悄悄跳过」。
              # 而 L3-G 恰恰是最容易悄悄消失的那个：它是 launch test，
              # 依赖 launch_testing_ament_cmake、要能起四个节点、要 DDS 通得了 ——
              # 任何一环在 CI 环境里不成立，最省事的失败方式就是"没生成结果文件"，
              # 而那时 colcon test-result 只会少报几条，总数依然远大于 1。
              #
              # 它值得单独守，因为它是**唯一**能在 CI 里验节点接线（话题/QoS/TF/参数/
              # 时序）的东西 —— CP-P2-B 要 GPU 和人，L1 结构上碰不到接线。
              # /route/path 的 QoS 那个 bug 从 P1 活到 P2-S4，就是因为这一层当时不存在。
              L3G=build/ads_control/test_results/ads_control/test_test_closed_loop.py.xunit.xml
              if [ ! -f "${L3G}" ]; then
                echo "✗ L3-G 闭环测试没有结果文件 —— 它没跑，而不是它通过了。"
                echo "  期望：${L3G}"
                exit 1
              fi
              L3G_COUNT=$(grep -oE "tests=\"[0-9]+\"" "${L3G}" | grep -oE "[0-9]+" | head -1 || echo 0)
              if [ "${L3G_COUNT}" -lt 1 ]; then
                echo "✗ L3-G 闭环测试结果文件里一个用例都没有"
                exit 1
              fi
              echo "✓ L3-G 闭环（假车 + map_node + control_node）跑了 ${L3G_COUNT} 个用例"
            '

      # launch 文件是 Python，语法错误和 import 错误只有真正执行才会暴露。
      # --show-args 会执行 generate_launch_description() 但不启动任何节点，
      # 所以不需要仿真器，几秒就能跑完。很便宜，但能挡住"launch 一跑就崩"。
      - name: 检查 launch 文件可加载
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ads-dev:jazzy bash -c '
              set -e
              set +u
              source /opt/ros/jazzy/setup.bash
              source /workspace/install/setup.bash
              set -u
              ros2 launch ads_bringup stack.launch.py --show-args
              ros2 launch gazebo_bridge gazebo_sim.launch.py --show-args
            '

      # ---------------------------------------------------------------------
      # 非法 sim 值必须让 launch **失败**，而不是静默空转
      #
      # 为什么这一步不能被上面那步替代：
      # --show-args 只执行 generate_launch_description()，而选数据源的
      # OpaqueFunction 是在 launch **真正启动**时才运行的 —— 它碰不到。
      #
      # 为什么也不能被 ads_bringup 的 pytest 替代：
      # 那边测的是「_resolve_sim_source 会抛 RuntimeError」，属于函数级。
      # 但异常抛出来之后，launch 框架是把它变成非零退出码，还是打条日志
      # 继续跑一个空的 LaunchDescription，是**框架的行为**，只有真跑才知道。
      # 而「进程活着、话题一个不少、就是永远没数据」正是本项目吃过亏的那种
      # 故障（见 CLAUDE.md 陷阱表）。所以这一层必须端到端验。
      #
      # ⚠️ 只断言退出码非零是不够的：包没装好、环境坏了同样会非零退出，
      #    那样这条检查就变成了又一个假绿。必须连报错**原因**一起断言。
      # ---------------------------------------------------------------------
      - name: 检查非法 sim 值会明确报错
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ads-dev:jazzy bash -c '
              set -e
              set +u
              source /opt/ros/jazzy/setup.bash
              source /workspace/install/setup.bash
              set -u

              assert_launch_fails() {
                sim_value="$1"
                expect="$2"
                if out=$(timeout 120 ros2 launch ads_bringup stack.launch.py \
                           "sim:=${sim_value}" gui:=false rviz:=false 2>&1); then
                  echo "✗ sim:=${sim_value} 竟然启动成功了。"
                  echo "  非法数据源必须让 launch 失败 —— 静默空转的症状和仿真器崩溃一模一样。"
                  exit 1
                fi
                if ! printf "%s" "${out}" | grep -q "${expect}"; then
                  echo "✗ sim:=${sim_value} 确实失败了，但不是因为我们期望的原因。"
                  echo "  期望报错信息里含：${expect}"
                  printf "%s\n" "${out}" | tail -20
                  exit 1
                fi
                echo "✓ sim:=${sim_value} 按预期失败，且报错信息正确"
              }

              # 已规划未实现 → 应当告诉用户去看路线图
              assert_launch_fails carla 尚未实现
              # 拼写错误 → 应当告诉用户这个值根本不认识，别去翻路线图
              assert_launch_fails gazbo 未知的
            '

      # ---------------------------------------------------------------------
      # 地图与路由的端到端验收（P1 任务 4.6）
      #
      # ★ 这一步能进 CI，是因为 verify_map.sh **不需要 Gazebo** ——
      #   map_node 只要一段 map→base_link 的 TF 就能工作，用
      #   static_transform_publisher 把自车钉在已知位姿上即可。
      #   不要 GPU、十几秒跑完、结果完全确定。
      #
      #   相比之下 verify_ros_bridge.sh / verify_teleop.sh 要真仿真器，
      #   进不了 CI，只能靠人记得跑 —— 而人记得跑的测试三个月后一定没人跑。
      #   所以凡是能剥离仿真器的验收，都值得多花点力气剥出来。
      # ---------------------------------------------------------------------
      - name: 地图与路由端到端验收
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            ads-dev:jazzy /workspace/scripts/verify_map.sh

      # 失败时把测试结果捞出来，省得靠日志一行行翻。
      - name: 上传测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
