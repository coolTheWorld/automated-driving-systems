# =============================================================================
#  验收场景里的静态障碍物 —— **唯一手写的源头**（P3-S5）
#
#  ⚠️ Gazebo 里的障碍物模型（models/campus_obstacles_<场景>/model.sdf）
#     由 scripts/gen_obstacles.py 从本文件生成，**不要手改生成物**。
#
#  为什么必须是生成物，与 CLAUDE.md §3b「地图单一来源」完全同构：
#  「车看到的障碍物」（/perception/obstacles）和「车会撞上的障碍物」（Gazebo 物理）
#  一旦各写一份就会漂移，而漂移的症状是**车绕过了一个不存在的东西、
#  然后撞上一个它看不见的东西** —— 全程没有任何模块报错。
#
#  本项目把这个风险降到零的办法比"两份生成物"更彻底：
#  **真值发布器直接读本文件**（由 launch 搬运成 ROS 参数），
#  只有 Gazebo 那一侧是生成物。于是根本不存在第二份数据。
#
#  ⚠️ **障碍物不进 worlds/campus_loop.sdf。** 那个世界是 CP-P2-B 的验收基线，
#     往里加东西会让 P2 的实测数字全部作废。障碍物按场景在**运行时**注入
#     （ros_gz_sim create），见 gazebo_sim.launch.py 的 obstacles 参数。
# =============================================================================

# 障碍物位置用**车道坐标**而不是世界坐标，理由有两条：
#   ① 可读：「距车道中心线右侧 1.2 m」一眼知道能不能绕，世界坐标要先心算；
#   ② **可校验**：生成器能用 docs/modules/planning.md §6 的不等式
#      机械判定这个场景到底可不可绕，并与下面的 expect 对账。
#      写世界坐标的话，那个判定就只能靠人心算，而人算错了不会有任何提示。
lane:
  # 自车出发所在的那条车道（园区环线**南侧**直道，行驶方向 +x）。
  #
  # 这些数字来自 config/campus_map.yaml 的推导结果：
  # 道路参考线 y = −50（环线半宽 100/2），行车道中心再偏 −1.75（半车道宽）。
  # ⚠️ 改了 campus_map.yaml 的 loop.width_m 或 lanes.width_m，这里要跟着改 ——
  #    生成器**不会**替你重算（它不解析地图几何，那是 ads_map 的事）。
  #    改完请重跑 scripts/gen_obstacles.py 并肉眼确认障碍物还在路面上。
  center_y_m: -51.75
  heading_rad: 0.0
  # 这条直道在世界坐标里的有效 x 区间。障碍物必须落在里面，否则生成器报错 ——
  # 放到路面外面的障碍物在 RViz 里看着完全正常，只是车永远不会遇到它，
  # 于是"绕障测试通过"变成一句空话。
  valid_from_x_m: 11.0
  valid_to_x_m: 78.0

scenarios:
  # ---------------------------------------------------------------------------
  #  场景一：可绕（CP-P3-B 的「绕」）
  # ---------------------------------------------------------------------------
  avoid:
    description: 贴右边的锥桶，侧向留得下车 —— 规划器应当从左侧绕过去
    # 生成器会用 §6 的不等式验算并与此对账。对不上就**拒绝生成**，
    # 而不是生成一个"看起来对"的世界然后让实测去发现。
    expect: avoidable
    obstacles:
      - name: cone_right
        # 沿车道中心线的世界 x（这段是直道，所以就是 x 坐标）。
        # 自车从 x = 30 出发，留 30 m 让它先把速度提起来。
        along_x_m: 60.0
        # 横向偏移，**左为正**（与全仓库一致）。−1.2 = 车道中心线右侧 1.2 m。
        # 由此：障碍物左缘 o_l = −1.2 + 0.25 = **−0.95 ≤ −0.55** ⟹ 可绕，
        # 可行区间 d ∈ [0.45, 0.85]，有 0.4 m 实打实的裕度（不是"恰好擦过"）。
        lateral_offset_m: -1.2
        length_m: 0.5
        width_m: 0.5
        # 高度只影响观感与雷达打点，不进碰撞判据（规划是二维的）。
        # 取 0.8 m：比车头低、比路缘高，肉眼一看就知道那是个该绕的东西。
        height_m: 0.8

  # ---------------------------------------------------------------------------
  #  场景二：绕不过去（CP-P3-B 的「停」）
  # ---------------------------------------------------------------------------
  block:
    description: 车道正中的锥桶 —— 几何上无解，规划器应当报不可行并停住
    expect: blocked
    obstacles:
      - name: cone_center
        along_x_m: 60.0
        # 0.0 = 正对车道中心线。左缘 o_l = +0.25 > −0.55 ⟹ **几何上无解**。
        # 从左绕要 d ≥ 1.65、从右绕要 d ≤ −1.65，而车道内不压线的上限只有 0.85。
        #
        # ⚠️ 这**不是**规划器的缺陷，是 ODD 的边界：3.5 m 车道装 1.8 m 的车
        #    再留 0.5 m 间距，只剩 1.2 m 给障碍物。现实里人开车绕障常要压线，
        #    是同一个不等式。P3 不允许借道（那要判断对向来车，属于 P7）。
        lateral_offset_m: 0.0
        length_m: 0.5
        width_m: 0.5
        height_m: 0.8

# ⚠️ **没有 "none" 场景**，这是有意的：
#    「无障碍物」不是一个要生成的东西，而是**什么都不生成**。
#    给它建一个空模型会让人以为"回归场景"也需要注入点什么，
#    而 CP-P3-B 的第三个场景恰恰要求世界与 CP-P2-B **逐字节相同**。
