# =============================================================================
#  园区地图 —— 双仿真环境的唯一来源（SPEC §4.1 强制要求第 2 条）
#
#  ⚠️ 这是**唯一**允许定义道路几何的地方。下面两样都是生成物，不要手改：
#
#     maps/campus.xodr              ← 两环境共用的 OpenDRIVE 地图
#                                      · ads_map 解析它 → 车道图 → 路由
#                                      · CARLA 用 generate_opendrive_world() 直接吃它（P0b）
#     models/campus_road/model.sdf  ← Gazebo 侧的道路可视几何
#
#     生成命令：python3 scripts/gen_map.py
#     同步校验：python3 scripts/gen_map.py --check     （CI 用）
#
#  为什么较真到要搞一套生成器：SPEC §4.1「双环境的头号风险：行为漂移」。
#  车辆参数那次防的是「Gazebo 里的车和 RViz 里的车不一样」；
#  这次防的是「ads_map 认为的车道」和「你在 Gazebo 里看到的路」不一样。
#
#  后者的症状特别阴险：路由算得出来、RViz 画得出来、车也开得动，
#  **但车沿着一条肉眼看不见的车道压着绿化带走**，全程没有任何模块报错。
#
#  所有键名带单位后缀。角度在 YAML 里用度（人读着方便），
#  生成器内部一律转弧度（SPEC §7：所有角度用弧度，只在输入输出时转换）。
# =============================================================================

name: campus

# -----------------------------------------------------------------------------
# 地理原点
#
# ⚠️ 必须与 worlds/*.sdf 里 <spherical_coordinates> 的值**逐字相同**。
#
# 三个原点在这里被强制重合：OpenDRIVE 的 (0,0) = Gazebo 世界原点 = ROS map 系原点。
# 不重合的后果不是「差一点」，而是 P4 拿 GNSS 做定位时，
# 两个仿真环境里同一个 x/y 会换算出不同的经纬度，定位结果无法互相比对 ——
# 而那时你已经在调 ESKF 的噪声参数了，根本不会想到是地图原点的问题。
# -----------------------------------------------------------------------------
geo_origin:
  latitude_deg: 31.230416
  longitude_deg: 121.473701
  elevation_m: 10.0

# -----------------------------------------------------------------------------
# 车道
#
# 采用 OpenDRIVE 的车道编号约定（这是规范定义的，不是我们的选择）：
#     lane  0  = 参考线本身，宽度恒为 0，不可行驶
#     lane -1  = 参考线**右侧**第一条，沿 s 增大方向行驶
#     lane +1  = 参考线**左侧**第一条，逆 s 方向行驶
#
# 右侧通行（中国/欧陆）下，-1 是「顺行道」，+1 是「对向道」。
# 这个符号约定是后面 ads_map 建**有向**车道图的依据 ——
# 建成无向图的话，Dijkstra 会算出「掉头逆行更近」的路径，
# 而它在 RViz 里看起来是一条完全正常的平滑曲线。
# -----------------------------------------------------------------------------
lanes:
  # 道路限速。写进 .xodr 的 <type><speed> 元素。
  #
  # ⚠️ 这是**道路属性**，与 vehicle_params.yaml 的 max_speed_mps（**车辆能力**）
  #    是两回事，不是重复定义：车能开 8.333 m/s，不代表这条路允许开这么快。
  #    P2 的速度规划取两者的较小值。
  #
  # 8.333 m/s = 30 km/h，来自 SPEC §2 ODD 的「设计最高 30 km/h」。
  # ⚠️ P1 不读这个值，第一个消费者是 P2 的速度规划。现在写进来是因为它属于地图，
  #    等 P2 再加意味着要重新生成地图并重跑 S2 的逐点对账 —— 没必要。
  speed_limit_mps: 8.333

  # 车道宽。与既有 campus_minimal.sdf 的 7 m 路面（车道中心 ±1.75）一致，
  # 也是国内园区/城市支路的常规值。
  # 调窄 → P2 的横向误差裕度变小，Stanley 参数没调好会明显压线；
  # 调宽 → 一切都变简单，但也就测不出控制器的问题了。
  width_m: 3.500
  # 每个方向的车道数。P1 只做单车道；多车道要处理换道，属于 P7 的范畴。
  count_per_direction: 1

# -----------------------------------------------------------------------------
# 环线主路（圆角矩形）
#
#         ╭───────────────╦───────────────╮   y = +width/2
#         │               ║               │
#    R    │               ║  横穿路        │    R
#         │               ║               │
#         ╰───────────────╩───────────────╯   y = -width/2
#        x = -length/2                 x = +length/2
#
# 下面两个数描述的是**中心线（参考线）的包络**，不是路面外沿。
# -----------------------------------------------------------------------------
loop:
  length_m: 180.0
  width_m: 100.0

  # 四角转弯半径。**这是整张地图对 P2 控制器最关键的一个数。**
  #
  # 低速园区的常规值是 10-15 m。取 12 m 的理由：
  #   · 自行车模型下所需转角 δ = atan(L/R) = atan(2.7/12) = 0.222 rad ≈ 12.7°，
  #     远小于 vehicle_params.yaml 的 max_steer_angle_rad = 0.600，有充足余量；
  #   · 巡航速度 5.556 m/s 时侧向加速度 v²/R = 2.57 m/s²，
  #     偏高于 SPEC §1.3 的舒适性判据（|a| < 2.0），
  #     所以 P2 的速度规划**必须**在弯道减速 —— 这是有意留的考题，不是失误。
  #
  # 调小 → 转角需求上升，接近机械极限，容易撞上限幅；
  # 调大 → 弯道变缓，任何横向控制器看起来都是对的，这条路就白修了。
  corner_radius_m: 12.0

# -----------------------------------------------------------------------------
# 横穿路
#
# 它的唯一存在意义是**让路由有得可算**。
# 没有它，环线上任意 A→B 只有「顺时针」和「逆时针」两条路，
# 而单向车道下更是只剩一条 —— 那样 Dijkstra 返回的「最短路」无法证明它是对的，
# 因为它连错都错不了。
# 有了横穿路，A→B 至少有 4 条候选路径，代价比较才真的发生了。
# -----------------------------------------------------------------------------
cross_road:
  # 横穿路的 x 位置。0 = 正中，把环线切成对称两半。
  # 挪成非对称（比如 30.0）会让两个 T 路口的连接几何不同，
  # 是检验生成器有没有把数写死的好办法。
  x_m: 0.0

# -----------------------------------------------------------------------------
# 路口
#
# OpenDRIVE 的路口不是一个点，是一块区域：每条腿在离路口中心一段距离处断开，
# 区域内部由若干条「连接道路」（connecting road）填充，每条连接道路对应
# 一个转向动作。3 条腿的 T 型路口共 6 条连接道路（直行 ×2 + 转弯 ×4）。
#
# ⚠️ 「每条腿退多远」（cutback）是**推导量，不在这里配**：
#     cutback = turn_radius + 车道半宽 + clearance
#
# 因为它必须 ≥ turn_radius + 车道半宽，否则转弯圆弧的切点会落到路口区域**外面**，
# 连接道路的几何就接不上了。把它做成可配参数等于给人一个填错就崩的机会；
# 做成推导量，这个约束就永远成立。
# （同样的思路见 vehicle_params.yaml：length = wheelbase + 前后悬，也是推导关系。）
# -----------------------------------------------------------------------------
junction:
  # 路口内转弯半径。园区路口的常规值。
  # 调小 → 转弯更急，P2 过路口时转角需求上升；
  # 调大 → 路口区域变大，两个路口之间的直路段变短。
  turn_radius_m: 8.0

  # 转弯圆弧切点到路口边界的余量。只影响连接道路首尾那两小段直线的长度。
  # 取 1.25 m 是为了避免生成长度只有几厘米的几何记录 ——
  # 那种记录合法但没意义，还会让 .xodr 读起来很吵。
  clearance_m: 1.250

# -----------------------------------------------------------------------------
# Gazebo 侧的可视化（只影响 models/campus_road/model.sdf，不影响 .xodr）
#
# 道路在 Gazebo 里**只有 <visual> 没有 <collision>**，沿用 P0a 的做法：
# 车已经在 ground_plane 上跑，再给路面加一层碰撞体是白白多算一份接触力，
# 而且两层几乎重合的碰撞面容易让求解器抖动。
# -----------------------------------------------------------------------------
visual:
  # 圆弧用多少段直盒子近似。段越多越圆滑，但 SDF 里的 visual 数量线性增长。
  # 12 段近似一个 90° 圆弧时，最大弦高误差 = R(1-cos(π/4/12)) ≈ 12 × 0.0021 = 2.6 cm，
  # 肉眼完全看不出，而 R=12 m 的弯道一共只多出 48 个 visual。
  # ⚠️ 这个数**只影响画面**。ads_map 用的是 .xodr 里的解析圆弧，不受它影响。
  arc_segments_per_quarter: 12

  # 路面比车道总宽向外多出的部分（路肩），单边。纯视觉，让路看起来不是紧贴车道边缘。
  shoulder_m: 0.500

  # 路面板厚度与离地高度。贴着地面放，避免 z-fighting（两个共面的面互相闪烁）。
  thickness_m: 0.010
  elevation_m: 0.005

  # 车道分隔线（画在参考线正上方，即双向车道之间）。
  center_line_width_m: 0.150

# -----------------------------------------------------------------------------
# 路侧立体结构 —— P4 定位的前提条件（2026-08-07 新增）
#
# ⚠️ 这一段不是装饰。**没有它，NDT 在这张地图上是几何上无解的。**
#
# 点云对位姿的约束来自表面法向，一个平面只能约束沿它法向的那一个自由度。
# 加这一段之前，世界里只有 ground_plane 和 0.01 m 厚的路面板 ——
# 所有点的法向都是 (0,0,1)，于是只有 z / roll / pitch 可观，
# **x / y / yaw 完全不可观**：点云在自己平面内滑动，配准残差一点不变。
# 而且板厚 0.01 m 恰好等于雷达噪声 stddev，连这点结构也被噪声吃掉。
#
# 症状会是「NDT 怎么调都飘」，然后所有人去查配准代码 —— 错却在这里。
# 推导与决策见 tasks/plan.md P4-1 决策一。
# -----------------------------------------------------------------------------
roadside_structures:
  # 结构外廓到**路面边缘**的最小间隙。生成时机械校验，违反则拒绝生成。
  #
  # 为什么要校验而不是相信填的人：结构侵入路面的症状是「车正常行驶却撞上路灯」，
  # 而所有人会去查规划器 —— 与 P3 那个「障碍物放在车道中间导致几何无解」同类。
  # 0.5 m 是给「车压线一点也不至于撞杆」留的余量，不是精确值。
  clearance_m: 0.500

  poles:
    # 路灯杆。沿每条常规道路的参考线等间距布置，两侧各一根。
    #
    # 间距：这是**纵向定位精度与 RTF 的权衡**。
    #   调小 → 视野内杆更多、纵向约束更强，但模型数与雷达光线投射量线性上升，RTF 下降。
    #   调大 → 直道上可能出现「视野里只有 1-2 根杆」的位形，纵向弱约束。
    # 取 20 m 的依据：雷达有效识别距离约 30 m（见下面 radius_m 的角分辨率账），
    # 前后 ±30 m 内每侧约 3 根、双侧 6 根，足以定住 x/y/yaw。
    #
    # ⚠️ 等间距会带来**混叠**：整体平移一个间距后杆与杆重合，形成周期性局部极小。
    #    NDT 的收敛域因此不超过 spacing/2 = 10 m。所以初值必须够好
    #    （用 ESKF 预测位姿作初值），且必须靠下面的 buildings 提供非周期锚点。
    spacing_m: 20.0

    # 从路面边缘再往外退多少。总横向偏移 = 路面半宽 + setback。
    # 调小 → 杆离车近、点数多，但压线时容易撞；调大 → 远处杆的点数按 1/d 掉。
    setback_m: 1.500

    # 杆半径。这个数**由雷达角分辨率倒推**，不是随手取的：
    #   水平角分辨率 = 360°/1800 = 0.2° = 3.491e-3 rad
    #   距离 d 处相邻两点的横向间隔 = d × 3.491e-3
    #   要在 50 m 处至少被打到 1 个点，直径必须 ≥ 50 × 3.491e-3 = 0.175 m
    # 取直径 0.30 m（半径 0.15）时：50 m 处 1.7 点/线、20 m 处 4.3 点/线、
    # 10 m 处 8.6 点/线 —— 所以**有效约束距离在 30 m 以内**，50 m 处形同虚设。
    # 调小到 0.10 → 30 m 外一个点都打不到，NDT 只能靠 buildings。
    radius_m: 0.150

    # 杆高。垂直分辨率 35°/32 线 = 1.09°，20 m 处相邻两线高度差 0.38 m。
    # 4 m 高的杆在 20 m 处覆盖约 10 条线 × 4.3 点 ≈ 45 个点，够 NDT 拟合高斯。
    # 调低到 1.5 m → 20 m 处只剩 4 条线，且容易被前车遮挡。
    height_m: 4.000

  # 建筑。**不沿路重复，必须逐个手填** —— 它们的作用与杆件不同：
  # 杆件是等间距的，天然带周期性（见上面的混叠说明）；建筑是非周期的，
  # 而且提供**大面积竖直面与拐角**。一个拐角（两个正交平面）单独就能定死 x/y/yaw。
  #
  # 位置约束由 clearance_m 机械校验，填错会被拒绝生成，不用手算。
  buildings:
    - {name: b_sw,    x_m: -45.0, y_m: -25.0, yaw_rad:  0.000, length_m: 30.0, width_m: 18.0, height_m:  8.0}
    - {name: b_nw,    x_m: -45.0, y_m:  25.0, yaw_rad:  0.000, length_m: 24.0, width_m: 16.0, height_m:  6.0}
    - {name: b_se,    x_m:  45.0, y_m: -25.0, yaw_rad:  0.300, length_m: 26.0, width_m: 20.0, height_m: 10.0}
    - {name: b_ne,    x_m:  45.0, y_m:  25.0, yaw_rad: -0.200, length_m: 20.0, width_m: 14.0, height_m:  7.0}
    - {name: b_north, x_m: -20.0, y_m:  66.0, yaw_rad:  0.000, length_m: 34.0, width_m: 16.0, height_m:  9.0}
    - {name: b_east,  x_m: 106.0, y_m:  10.0, yaw_rad:  0.000, length_m: 18.0, width_m: 26.0, height_m: 12.0}
    # 这两栋专门补横穿路（x=0 那条）的覆盖。它只有 78 m 长、放得下 3 组杆，
    # 而其余建筑离它都超过 30 m —— 实测中段最贫瘠处只能看见 **2 根杆、0 栋建筑**。
    # 两个路标在数学上足以定住 2D 位姿，但**没有冗余**：一根杆被前车遮住就退化。
    # 加这两栋之后同一位置可见 2 栋建筑。这类"贫瘠段"要靠扫一遍路线才看得见，
    # 不是靠盯着地图猜 —— 检查脚本见 S1 出口记录。
    - {name: b_mid_e, x_m:  26.0, y_m:   4.0, yaw_rad:  0.150, length_m: 22.0, width_m: 20.0, height_m:  9.0}
    - {name: b_mid_w, x_m: -27.0, y_m:  -6.0, yaw_rad: -0.100, length_m: 20.0, width_m: 22.0, height_m:  7.0}

  # ---------------------------------------------------------------------------
  # 先验点云地图（maps/campus_cloud.pcd）的采样参数
  #
  # 为什么解析采样而不是开车跑一圈累积真值点云：地图是**先验**，它应该来自
  # 地图源。用一次仿真跑的产物当先验，等于让地图依赖那一条路线 ——
  # 换条路线或换个世界，地图就悄悄变了，而且它进不了 CI（要 GPU、不确定）。
  # 详见 tasks/plan.md P4-1 决策二。
  # ---------------------------------------------------------------------------
  cloud:
    # 路面采样步长。路面只贡献 z / roll / pitch（法向全是 +z），
    # 所以不需要密。但也不能太稀：NDT 的 voxel 里点太少高斯就估不准。
    # 0.5 m 时一个 2 m voxel 内有 16 个点。
    #
    # ⚠️ 路面点在 voxel 内**共面**，协方差矩阵秩亏（rank 2）——
    #    NDT 实现必须对最小特征值做正则化，否则求逆时炸。这条写进 S3 的边界。
    road_step_m: 0.500

    # 杆件表面的采样步长。**必须比墙面密得多，因为杆是细的**：
    # 半径 0.15 m 的杆周长只有 0.94 m，用 0.5 m 步长整根杆只剩 2×8=16 个点，
    # 而杆恰恰是纵向约束的主要来源。0.10 m 时约 9（周向）× 40（高度）= 360 点/根。
    pole_step_m: 0.100

    # 建筑墙面与屋顶的采样步长。**不需要密**：墙是大块平面，
    # 信息量在「平面 + 拐角」而不在点数。0.5 m 时一个 2 m 的 NDT voxel
    # 内有 4×4=16 个点，足够拟合高斯；取 0.15 会让地图大 11 倍而不多一点信息。
    wall_step_m: 0.500

    # ⚠️ 地图**不含路面以外的地面**（Gazebo 的 ground_plane 是无限大的）。
    #    按 0.5 m 铺满 260×180 要 18.7 万点，比其余所有东西加起来还多一个量级，
    #    而它只贡献 z/roll/pitch —— 那几个自由度 IMU 的重力矢量已经给了。
    #    代价是草地上的实测点会落进空 voxel 被当成外点，这是可接受的：
    #    「世界比地图多」只造成外点，「地图比世界多」才会造成**错误匹配**。

    # ⚠️ 已知的系统差异：解析采样是**全表面**均匀采样，而雷达只看得到朝向
    #    自己的那一面、且有遮挡和距离衰减。NDT 用 voxel 内的高斯做匹配，
    #    对这个差异容忍度尚可，但 voxel 取太小时会暴露。见 S3 的边界节。
