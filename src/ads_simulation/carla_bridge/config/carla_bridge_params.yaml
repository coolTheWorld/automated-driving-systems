# =============================================================================
#  carla_bridge 的环境 B 专属参数（P8-S4）
#
#  ⚠️ 车辆几何/能力/传感器外参**不在这里** —— 单一来源是
#     config/vehicle_params.yaml（SPEC §4.1）。这里只放 CARLA 会话本身的东西。
#
#  ⚠️ spawn 位姿必须与 worlds/campus_loop.sdf 的自车 spawn 一致：
#     map→odom 静态 TF 就是它（CLAUDE.md §5，P0a 的单位变换教训）。
# =============================================================================

carla_sidecar:
  ros__parameters:
    use_sim_time: true

    # 与 campus_loop.sdf 一致（gazebo_sim.launch.py 是从世界文件里读的；
    # CARLA 没有世界文件，这里手填 + 上机 checklist 里有一条核对项）。
    spawn:
      x_m: 30.0
      y_m: -51.75
      yaw_rad: 0.0

    # 轴距 2.684 vs 2.700（差 0.6%）。⚠️ 别换 tesla.model3（差 11.3%，
    # apply_physics_control 改不了轴距，而它直接进 Stanley 前轴换算）。
    ego:
      blueprint: vehicle.citroen.c3

    control:
      # 与 gazebo 侧 vehicle_cmd_bridge 的看门狗同值同语义。
      watchdog_timeout_s: 0.5
      # throttle/brake 标定 —— S5 实测（2026-08-14，RTX 3090，Town10，
      # 工作带 v∈[2,6]）：油门-加速度强非线性（0.4 顶不动风阻、0.6→0.51、
      # 0.8→2.28 m/s²），线性拟合带偏置：throttle = bias + k·a。
      #   k    = Δth/Δa = 0.2/1.77 ≈ 0.113
      #   bias = 0.6 − 0.113×0.51 ≈ 0.54（工作带内风阻/滚阻的持续补偿）
      # brake：全刹实测 −5.40 m/s² ⟹ 1/5.40 ≈ 0.185。
      # 怠速死区 0.05：bias 在静止小指令下会蠕动，死区内直接怠速。
      # ⚠️ 换蓝图/换 CARLA 版本要重标（scripts/carla_calibrate_throttle.py 是那把尺子）。
      throttle_per_mps2: 0.113
      brake_per_mps2: 0.185
      throttle_bias: 0.54
      idle_below_mps2: 0.05

    tick_hz: 50.0
