  # ---------------------------------------------------------------------------
  #  行人 —— 小目标检测下限 + 与 NPC 车互相遮挡
  # ---------------------------------------------------------------------------
  pedestrian:
    classification: pedestrian

    # 0.4 × 0.4 × 1.7 —— 成年人的包围盒量级。
    #
    # ⚠️ 这个尺寸决定了「能不能看见」：按雷达角分辨率算，20 m 处
    #    垂直覆盖约 4.4 线 × 水平 5.7 点 ≈ 25 点，25 m 处约 16 点。
    #    比锥桶（20 m 处约 15 点）好一些 —— 因为它**高**，能被更多线扫到。
    #    调矮到 1.2 m，20 m 处掉到约 15 点，就贴上聚类的最小簇点数了。
    length_m: 0.4
    width_m: 0.4
    height_m: 1.7

    # 沿**对向车道那一侧**平行于道路走，不横穿。
    #
    # ⚠️ **不许侵入自车车道**（生成器机械校验，违反则拒绝生成）。
    #    理由不是"怕撞"，而是：规划器会把 /perception/obstacles 里的东西
    #    拿去做碰撞检查，一个走进自车车道的行人会让车减速或绕行 ——
    #    而 P5 **不做**避让（那是 P7 行为决策）。于是现场表现是
    #    「车莫名其妙停了」，所有人去查规划器，而错在场景设定。
    #    这与 P3「障碍物放在车道中间几何无解」是同一类问题。
    #
    #    想验「感知到横穿行人后车该怎么办」，那是 P7 的场景，不是这里。
    #
    # y = −46.5 在对向车道再往北 1.75 m，即路肩位置，
    # 距自车车道边界（−50.0）有 3.5 m，余量充足。
    waypoints:
      # ⚠️ 起点 x=30 不是随手挑的（2026-08-12 定，实测几何倒推）：
      #    CP-P5-B 第 6 条「遮挡后 ID 保持」要求行人在**判据范围内**（≤30 m）
      #    被车挡住再出现。旧起点 x=40 时遮挡发生在行人 48→28 m ——
      #    行人**进入量程时已经在遮挡里**，窗前没有可比的 ID，判据空转
      #    （首轮实测：窗口 0 个）。把起点提前 10 m，车与自车交会（t≈52）时
      #    行人在 ~20 m：遮挡前已被稳定跟踪，判据才有东西可判。
      #    速度保持 1.2（正常步速）不动 —— 它有物理含义，起点没有。
      - [30.0, -46.5]
      - [95.0, -46.5]
    speed_mps: 1.2

  # ===========================================================================
  #  以下五个 actor 是 P7 行为决策的场景（2026-08-13，决策三拍板）。
  #
  #  ⚠️ **它们是第一批获准进入自车车道的目标。** P5 的校验②（不许侵入）
  #     保护的是「规划不消费动态语义」的旧世界；P7 之后侵入自车道的目标是
  #     **考题**不是事故。豁免按 actor 用 may_enter_ego_lane: true 显式声明，
  #     四个既有场景与三个既有 actor 逐字节不动（--check 守着）。
  #
  #  相位公约（三个场景共用，与 CP-P5-B/P6-B 扩窗协议对齐）：
  #    ⚠️ **dwell 从 actor 拿到自己位姿那一刻起算 ≈ 仿真 0.1 s**（S1 体检实测：
  #    depart_delay_s=27 实测出发 t=27.1）—— 不是「bringup 完成的 t≈13」。
  #    仿真钟从 gz 起动就在走，spawn 远早于全栈就绪；把 13 当基准整个错位
  #    13 s（S1 首轮就错了，实测改正）。
  #    goal 在**绝对仿真钟 37.0 s** 由预热发布器发出；自车 ~3.7 s 加速到 5.556。
  #  depart_delay_s ≈ 期望出发的绝对仿真秒；容 ±4 s 抖动（curve_car 教训）。
  # ===========================================================================

  # ---------------------------------------------------------------------------
  #  lead_car —— S03 跟车：自车道内同向 3 m/s，行至 x=70 停 12 s 再驶离
  #
  #  ⚠️ 决策三的行文是「行至 x≈70 停住（到末点停）」，但 CP-P7-B 判据 ③
  #     「前车驶离后 ≤3 s 恢复」**要求它再走** —— 永久停住的前车没有驶离。
  #     S1 用 dwell 机制两全：x=70 处停 12 s（瞬停语义保留，运动学等效
  #     无穷减速度，对 TTC 判据是更严的考题）再继续驶离。
  #
  #  相位账（dwell 基准 = 仿真 0.1，S1 体检实测后修正 27→39）：
  #    出发 t≈39.1（自车 37 起步、~40.7 达巡航于 x≈40.3）；先动车跟随
  #    （自车 2.556 m/s 接近差，t≈44 追到车尾），3 m/s 行 25 m 后
  #    t≈47.4 瞬停于 x=70 → 跟停稳态 12 s（判据 ② 的稳态窗）；
  #    t≈59.4 驶离 → 判据 ③ 的激励。
  #    早 4 s：出发 35，自车追上更远的动车，跟停照样发生；
  #    晚 4 s：出发 43，自车先对**静止**前车跟停（顺带激励 STATIC
  #    红线用例）再跟动车 —— 两个极端都成立，相位不贴边。
  #  S1 体检实测（旧相位 27）：瞬停时长 12.0 s 分毫不差、速度 3.09 m/s、
  #  带内感知匹配 100%、ID 换手 0 —— 运动学与感知无须再调，只挪相位。
  #  终点 x=105：驶离后离开自车路径（自车 78 起转弯，它直行出场——
  #  与 npc_car 同一条「草地上没物理问题」的既有约定）。
  # ---------------------------------------------------------------------------
  lead_car:
    classification: vehicle
    may_enter_ego_lane: true  # P7 的考题：S03 跟车的前车就在自车道里
    waypoints:
      - [45.0, -51.75]
      - [70.0, -51.75]
      - [105.0, -51.75]
    depart_delay_s: 39.0     # 出发相位（在出生点的停留，基准=仿真 0.1）
    dwell_s: [0.0, 12.0, 0.0]  # 与 waypoints 逐一对应的中途停留
    speed_mps: 3.0
    loop: false  # 驶离后停在终点，不折返 —— 折返会迎头撞上正在恢复的自车

  # ---------------------------------------------------------------------------
  #  crossing_pedestrian —— S05 横穿：从北侧路肩穿过自车道到南侧，中途停 6 s
  #
  #  与 P5 的 pedestrian（沿路肩平行走、明写「不横穿——那是 P7」）是
  #  **两个 actor**：那份注释到 P7 过期的正是这一条，但 P5 场景要逐字节
  #  冻结，所以新开而不是改旧。
  #
  #  ⚠️ 车道中央的 dwell 6 s 不是造型，是**判据的鲁棒性设计**：
  #     判据 ④ 要求自车**完全停止**（v<0.05）。若行人一次走完，
  #     在自车道内只停留 3.5/1.2 ≈ 2.9 s —— spawn 抖 ±4 s 就可能变成
  #     「自车减速让过、从未停死」，判据红而系统对（curve_car 相位三调的
  #     同型教训）。停 6 s 后，自车到场时车道被占是**必然事件**。
  #
  #  相位账（dwell 基准 = 仿真 0.1，S1 体检实测后修正 25→38）：出发 t≈38.1；
  #  y −46→−50 用 3.33 s（t≈41.4 进自车道），到中途停点（见下）t≈42.9，
  #  停 6 s 到 48.9，t≈50.4 出车道（y<−53.5）。自车不受阻会在 t≈43.3 过
  #  x=55 —— 正撞上占道窗口 [41.4, 50.4] 的前段。晚 4 s 时行人 45.4 才进道，
  #  但它以 1.2 m/s 南向直奔车道，CV 预测 3 s 视界内就报冲突 —— 让行由预测
  #  触发，不必等人到（P6 交付的能力正是为这一刻）。
  #  x=55：避开静态障碍场景常用的 x 区间，也给自车从 30 起步留足 25 m 视距。
  #
  #  ⚠️ **中途停点航点填 −52.75，不是车道中心 −51.75**（S1 体检实测逼出来的）：
  #     npc_controller 判到达用 arrival_radius_m=1.0，到距航点 1.0 m 就触发
  #     dwell —— 填 −51.75 时实测停在 y=−50.80，行人站在自车扫掠走廊的
  #     **边缘**（自车体 [−52.65,−50.85]，重叠只剩 0.15 m），冲突从「必然」
  #     退化成「擦边」。往南多填一个到达半径，实际停点才落在车道中心。
  # ---------------------------------------------------------------------------
  crossing_pedestrian:
    classification: pedestrian
    may_enter_ego_lane: true  # P7 的考题：横穿本身就是侵入
    length_m: 0.4
    width_m: 0.4
    height_m: 1.7
    waypoints:
      - [55.0, -46.0]
      - [55.0, -52.75]
      - [55.0, -55.5]
    depart_delay_s: 38.0
    dwell_s: [0.0, 6.0, 0.0]  # 车道中央停 6 s，理由见上
    speed_mps: 1.2
    loop: false  # 穿过去就退场，不折返

  # ---------------------------------------------------------------------------
  #  cross_car_a/b/c —— 无信号路口让行：三辆车 6 s 车头时距组成「车流」
  #
  #  路线见顶部 cross_route（北路东行 → j_north 右转 → 横穿路南下 →
  #  j_south 左转离场）。自车的对应路线：goal 设在横穿路南行车道
  #  (−1.75, −30)，Dijkstra 唯一解经 j_north **左转**（xodr 里南行车道
  #  只有这一个入口，路由无第二候选）—— 左转横穿北路东行车道，正对车流，
  #  「让行」的几何由地图保证，不靠运气。
  #
  #  ⚠️ 为什么是**三辆**而不是一辆：单辆车过路口只占 ~3 s，自车到场时刻
  #     受 spawn 抖动 ±4 s 影响 —— 一辆车的窗口贴边（又是 curve_car 教训）。
  #     三辆 6 s 时距把「车流通过」拉成 ~15 s 的带，自车到场（t≈84.5±1.5）
  #     必然落在带内。6 s × 4 m/s = 24 m 间隙 > 安全跟距，车流内部不追尾。
  #
  #  相位账（dwell 基准 = 仿真 0.1，S1 体检实测后修正 58/64/70→71/77/83）：
  #  a 出发 t≈71.1，50.25 m 直线进场 12.6 s，t≈83.7 进 j_north 转弯区，
  #  ~86.8 完成右转南下；b、c 各推迟 6 s。
  #  自车：路线 30→78 直道 + 两个弯（曲率限速 ~4.0）+ 东路 76 m + 北路 67 m
  #  ≈ t 84–85 到 j_north 左转口 —— 正对 a 或 b 的通过窗口。
  #  离场终点 x=+60（南路东行）：距自车 goal (−1.75,−30) 65 m+，出判据带。
  #  loop=false：折返会把「车流」变成永动的迎面流，自车永远过不去。
  # ---------------------------------------------------------------------------
  cross_car_a:
    classification: vehicle
    route: cross_road_southbound
    depart_delay_s: 71.0
    speed_mps: 4.0
    loop: false
    # 航点是推导量（derive_cross_road_southbound，1 mm 对账），三辆车共用
    # 同一条航线（YAML 锚点），只差出发相位。
    waypoints: &cross_route_waypoints
      - [-60.0000, 48.2500]
      - [-9.7500, 48.2500]
      - [-8.3608, 48.1285]
      - [-7.0138, 47.7675]
      - [-5.7500, 47.1782]
      - [-4.6077, 46.3784]
      - [-3.6216, 45.3923]
      - [-2.8218, 44.2500]
      - [-2.2325, 42.9862]
      - [-1.8715, 41.6392]
      - [-1.7500, 40.2500]
      - [-1.7500, -43.7500]
      - [-1.6285, -45.1392]
      - [-1.2675, -46.4862]
      - [-0.6782, -47.7500]
      - [0.1216, -48.8923]
      - [1.1077, -49.8784]
      - [2.2500, -50.6782]
      - [3.5138, -51.2675]
      - [4.8608, -51.6285]
      - [6.2500, -51.7500]
      - [60.0000, -51.7500]
  cross_car_b:
    classification: vehicle
    route: cross_road_southbound
    depart_delay_s: 77.0
    speed_mps: 4.0
    loop: false
    waypoints: *cross_route_waypoints
  cross_car_c:
    classification: vehicle
    route: cross_road_southbound
    depart_delay_s: 83.0
    speed_mps: 4.0
    loop: false
    waypoints: *cross_route_waypoints

# -----------------------------------------------------------------------------
#  场景 —— 与 obstacles.yaml 的 scenarios 独立，两个开关可以自由组合
# -----------------------------------------------------------------------------
#  ⚠️ **必须能分开控制**：CP-P5-B 第 9 条要在「关掉真值障碍物」的前提下
#     复测 CP-P3-B，那一跑不能有行人或 NPC 车干扰（它们会进碰撞检查）。
#     所以那一跑是 obstacles:=avoid dynamic:=none。
scenarios:
  oncoming:
    description: 只有对向行驶的 NPC 车 —— 验速度估计的符号与 ID 稳定
    actors: [npc_car]
  cross:
    description: 只有行人 —— 验小目标检测下限
    actors: [pedestrian]
  both:
    description: 车与人同时在场 —— 验数据关联（2×2 匈牙利）与互相遮挡
    actors: [npc_car, pedestrian]
  curve:
    description: 沿内圈车道绕圈的车 + 行人 —— P6 预测的过弯激励（CP-P6-B 用）
    actors: [curve_car, pedestrian]
  # ---- P7 行为决策的三个场景（S1）。每个场景只放自己的考题，互不掺和：
  #      判据表是按场景写的（CP-P7-B ①-⑨），多放一个 actor 就是往别人的
  #      考卷里塞题。goal 也各不相同：follow/crossing 用标准 goal (91.75,20)，
  #      junction 用横穿路上的 (-1.75,-30)（路由唯一解经 j_north 左转）。
  follow:
    description: S03 跟车 —— 自车道内同向前车，行至 x=70 瞬停 12 s 再驶离
    actors: [lead_car]
  crossing:
    description: S05 横穿 —— 行人从北路肩穿过自车道，车道中央停 6 s
    actors: [crossing_pedestrian]
  junction:
    description: 无信号路口让行 —— 三辆车 6 s 时距沿横穿路南下，ego 左转让行
    actors: [cross_car_a, cross_car_b, cross_car_c]

# ⚠️ 与 obstacles.yaml 一样，**没有 "none" 场景**：
#    「没有动态目标」不是一个要生成的东西，而是什么都不生成。
#    CP-P2-B / CP-P3-B / CP-P4-B 的回归要求世界与基线**逐字节相同**。
