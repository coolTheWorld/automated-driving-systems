# =============================================================================
#  感知参数（P5-S5）
#
#  ⚠️ 这里只放**「我们想怎么感知」**，不放**「传感器能做什么」**。
#     雷达的线数、视场、量程在 config/vehicle_params.yaml 的 sensors.lidar，
#     两者的分工与 control_params / vehicle_params 完全同构：
#     混在一起的话，换一个雷达要来这里翻参数，而那正是 SPEC §4.1
#     「行为漂移」的温床。
#
#  ⚠️ **下面标了「安全关键」的两个参数不是普通调参项。**
#     它们调错不会报错，只会让目标在某个距离上**静默消失**，
#     而现场表现是「车快撞上了才开始绕」—— 看起来像规划器反应慢。
# =============================================================================

ground:
  # RANSAC 迭代次数。地面点占比 p≈0.5 时，100 次里至少一次三点全中的
  # 概率是 1−(1−0.125)¹⁰⁰ ≈ 1−1.4e-6。
  # 调小到 20 → 概率掉到 93%，也就是**每 14 帧就有一帧找不到地面**。
  max_iterations: 100

  # 内点距离阈值，m。雷达测距 σ=1 cm，但路面板本身有 0.01 m 厚，
  # 且远处的点受角分辨率影响。
  # 调小到 0.05 → 远处地面点被判成障碍物（虚警）；
  # 调大到 0.40 → **矮障碍物被吞进地面**（锥桶才 0.8 m 高）。
  distance_threshold_m: 0.15

  # 候选平面允许的最大坡度，rad（0.26 ≈ 15°）。
  # ⚠️ 不检查的话**一堵墙会赢**（立面上的点又多又共面），
  #    选中墙之后真正的地面全变成障碍物，聚类会连成一个几十米的巨簇。
  max_slope_rad: 0.26

  # 只在这个高度以下找地面，m。防止把车顶或货箱顶面当成地面。
  max_height_m: 1.0
  min_inliers: 100

cluster:
  # ⚠️⚠️ **安全关键。** 邻域半径，m —— 被雷达线间距从下面顶着。
  #
  # 32 线 / 垂直 FOV 35° ⟹ 线角间隔 1.129°，于是距离 d 处的线间距：
  #     20 m: 0.394   25 m: 0.493   30 m: 0.591
  # 小于线间距 → 同一目标被**按扫描线拆碎**，每片都凑不够 min_cluster_size
  # ⟹ **目标整个消失**（比拆成两个更危险，后者至少还看得见）。
  # 另一侧：判据要求相距 1.0 m 的两个目标必须分开，所以要 < 1.0。
  #
  # 取 0.5：覆盖到 25 m，对 1.0 m 判据留 2 倍余量。
  # 代价是 30 m 外拆簇 —— 那是角分辨率的直接后果，不是参数没调好。
  tolerance_m: 0.5

  # ⚠️⚠️ **安全关键。** 成簇的最小点数，由 S1 的**实测**定：
  #     scripts/check_perception_input.py（2026-08-11，命中帧的中位点数）
  #     锥桶 20–25 m: 7 点 | 行人 20–25 m: 7 点 | NPC 车 20–25 m: 40 点
  # 取 5 保住 20–25 m 的锥桶与行人（留 1.4 倍余量）。
  # 调到 10 → 它们在 20 m 外**直接看不见**。
  min_cluster_size: 5

  # 超过它的簇被丢弃。一帧才 2–5 万点，一个占近半数点的"目标"
  # 只可能是地面分割失败 —— 宁可丢掉也不要给下游一个几十米长的障碍物。
  max_cluster_size: 20000

lshape:
  # 朝向搜索的角步长，rad（0.01745 = 1°）。矩形有 90° 周期，只搜 [0, π/2)。
  # 判据要求朝向误差 < 10°，1° 的量化误差留了 10 倍余量。
  angle_step_rad: 0.01745
  # 少于这么多点就不拟合。取 4（三点必定共面，任何朝向都能"完美贴合"）。
  # ⚠️ 不要因为"想更稳"调到 10 —— S1 实测锥桶/行人在 20–25 m 只有 7 点，
  #    调大等于让它们在那个距离上失去朝向。朝向不可靠时下游还能退回用
  #    轴对齐包围盒，而目标整个消失就没得救了。
  min_points: 4

tracker:
  # 过程噪声：**加速度**标准差，m/s²。恒速模型假设目标不加速，实际会 ——
  # 这个量就是"允许它多不守规矩"。取 2.0（园区目标的量级）。
  process_accel_stddev_mps2: 2.0

  # 观测噪声：检测位置的标准差，m。
  # ⚠️ 取 0.3 而不是 S2 实测的 0.003 —— 那 0.003 是**可见面**的定位精度，
  #    而检测给的是包围盒中心，它随目标朝向与遮挡变化（雷达打不到背面），
  #    帧间抖动远大于面的定位精度。
  measurement_stddev_m: 0.3

  # 关联门限：马氏距离平方上限。9.21 = χ²(2, 99%)。
  # ⚠️ **这次可以查卡方分布表**，因为协方差是滤波器按已知的 Q/R 递推出来的
  #    —— 与 P4 那个未标定的 NDT 协方差不同（那里只能用固定阈值，
  #    见 docs/modules/localization.md §10.6）。同一个词在两处的可用性不同。
  gate_chi_square: 9.21

  # ⚠️⚠️ 累计命中多少次才算确认。**不要求连续** —— 这一条直接来自 S1 实测。
  #
  # S1 体检：目标在连续帧之间**闪烁**，命中率只有 33–74%。按 p=0.5 算，
  # 「连续 3 帧命中」的概率只有 12.5%，平均要等 8 次机会（0.8 s）才确认 ——
  # 而目标可能只在视野里待几秒。**那不是保守，是看不见。**
  confirm_hits: 3

  # 连续未命中多少帧就删除。取 5（0.5 s）：p=0.5 时误删概率 3.1%。
  # 调小到 3 → 误删概率 12.5%，闪烁场景下 ID 会频繁跳变；
  # 调大到 10 → 目标走了还留着"幽灵航迹"，而规划会绕它。
  max_misses: 5

  # 速度超过它才用来消歧朝向，m/s。
  # ⚠️ 低于这个速度，速度方向由噪声主导 —— 拿噪声去定朝向还不如老实说
  #    "不知道"。静止目标的车头朝向**物理上无解**，猜错的概率 50%，
  #    而错了之后 P6 会预测出一条逆行轨迹。
  heading_min_speed_mps: 0.5

# 点云比这么旧就丢，s。与 localization_node 那条同一个理由：
# 用旧帧算出来的障碍物位置对应的是**过去**的时刻，而下游会当成现在的。
max_cloud_age_s: 0.15
