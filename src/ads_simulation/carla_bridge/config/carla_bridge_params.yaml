# =============================================================================
#  carla_bridge 的环境 B 专属参数（P8-S4）
#
#  ⚠️ 车辆几何/能力/传感器外参**不在这里** —— 单一来源是
#     config/vehicle_params.yaml（SPEC §4.1）。这里只放 CARLA 会话本身的东西。
#
#  ⚠️ spawn 位姿必须与 worlds/campus_loop.sdf 的自车 spawn 一致：
#     map→odom 静态 TF 就是它（CLAUDE.md §5，P0a 的单位变换教训）。
# =============================================================================

carla_sidecar:
  ros__parameters:
    use_sim_time: true

    # 与 campus_loop.sdf 一致（gazebo_sim.launch.py 是从世界文件里读的；
    # CARLA 没有世界文件，这里手填 + 上机 checklist 里有一条核对项）。
    spawn:
      x_m: 30.0
      y_m: -51.75
      yaw_rad: 0.0

    # 轴距 2.684 vs 2.700（差 0.6%）。⚠️ 别换 tesla.model3（差 11.3%，
    # apply_physics_control 改不了轴距，而它直接进 Stanley 前轴换算）。
    ego:
      blueprint: vehicle.citroen.c3
      # 传动系拉平（P9-S5d 评估，2026-08-16 云窗口 6）：发动机零油门阻尼 = 全油门阻尼、
      # 扭矩曲线恒定 350 Nm。原车 a(throttle, v) 在 4–5 m/s 箱增益比 2–3 箱高 78%
      # （扭矩峰 1700 rpm ≈ 4.8 m/s）、偏置随速度 0.48–0.55 —— S01「冲宽-急刹」四条跟踪
      # 差异的机理本体。拉平后各箱斜率 4.5–4.7、偏置 ≈0.06（scripts/carla_throttle_map_probe.py
      # --align 的表）。⚠️ **默认关**：拉平 + 重标（k 0.222 / bias 0.06）的首轮 S01：Δv 0.42→0.25
      # 变好，但低速起步/蠕动死区（th 0.10 从静止只给 ≈0 加速）让车停在目标前 3.96 m、
      # 弯道 a_lat 未改善 —— 「静态准≠闭环好」第二次应验，闭环还差蠕动偏置 / 制动-滑行
      # 配平 / PI 复调三件事，是一个独立的标定战役（plan P9-S5d 评估报告），待拍板。
      # 打开时把下面 control 的常数换成 0.222 / 0.06。
      align_drivetrain: false
      flat_torque_nm: 350.0

    control:
      # 与 gazebo 侧 vehicle_cmd_bridge 的看门狗同值同语义。
      watchdog_timeout_s: 0.5
      # throttle/brake 标定 —— S5 实测（2026-08-14，RTX 3090，Town10，
      # 工作带 v∈[2,6]）：油门-加速度强非线性（0.4 顶不动风阻、0.6→0.51、
      # 0.8→2.28 m/s²），线性拟合带偏置：throttle = bias + k·a。
      #   k    = Δth/Δa = 0.2/1.77 ≈ 0.113
      #   bias = 0.6 − 0.113×0.51 ≈ 0.54（工作带内风阻/滚阻的持续补偿）
      # brake：全刹实测 −5.40 m/s² ⟹ 1/5.40 ≈ 0.185。
      # 怠速死区 0.05：bias 在静止小指令下会蠕动，死区内直接怠速。
      # ⚠️ 换蓝图/换 CARLA 版本要重标（scripts/carla_calibrate_throttle.py 是那把尺子）。
      # S6 定稿 = 两点粗标版（bias 0.54 / k 0.113）。⚠️ 五档位精标
      # （throttle = 0.479 + 0.142·a，静态上更准）在**闭环里更差**
      # （稳态 0.42→0.57、车卡墙未到达）——静态映射精度不是稳态误差的
      # 主导项（20 FPS 下 PI 降频 + 档位/换挡动态才是），闭环表现优先。
      # 五点数据留档：0.45→0.029 / 0.55→0.293 / 0.65→1.112 /
      # 0.75→1.894 / 0.85→2.667。
      # ---- P9-S5d 评估留档（2026-08-16，传动系拉平后重标，5090 / Town10 / c3）----
      # align_drivetrain: true 时的常数：拉平后 a(th) 各速度箱（2–5 m/s）斜率 4.49–4.67 m/s²
      # 每单位油门 ⟹ k ≈ 1/4.5 = 0.222；偏置 th 0.10 → a 0.11–0.29 ⟹ bias ≈ 0.06。
      # 现值仍是原车两点粗标（0.113 / 0.54，上面那段的推导）—— 与 align_drivetrain: false 配套。
      throttle_per_mps2: 0.113
      brake_per_mps2: 0.185
      throttle_bias: 0.54
      idle_below_mps2: 0.05

    tick_hz: 50.0
